# Mobile-tuned defaults for the armv7/iOS 9.3 port. Copied into Documents on
# first launch only (see Z3Runtime_Prepare); a user's own zelda3.ini there is
# never overwritten.
[General]
Autosave = 1
DisplayPerfInTitle = 0
ExtendedAspectRatio = 4:3
DisableFrameDelay = 0

[Graphics]
WindowSize = Auto
Fullscreen = 0
WindowScale = 2
NewRenderer = 1
# 4x4 mode-7 upsampling is not implemented by this port (see Z3Runtime_Prepare):
# it would roughly 16x the pixel-fill cost of the world map on a phone-class
# A5/A6 GPU-less software renderer. Leave this off.
EnhancedMode7 = 0
IgnoreAspectRatio = 0
NoSpriteLimits = 1
OutputMethod = SDL
LinearFiltering = 0
DimFlashes = 0

[Sound]
EnableAudio = 1
AudioFreq = 44100
AudioChannels = 2
AudioSamples = 1024
# MSU needs the Opus decoder, which this port does not ship (see the stub in
# Engine/third_party/opus-1.3.1-stripped/opus.h). Built-in SPC/DSP music plays
# regardless of this setting.
EnableMSU = false
ResumeMSU = 1
MSUVolume = 100%

[Features]
