name: Zelda3iOS
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "14.7"
  createIntermediateGroups: true
  # XcodeGen picks the newest project file format it knows how to emit,
  # regardless of which Xcode is active via xcode-select. That format can
  # be newer than what an older pinned Xcode (e.g. 15.4 in CI) can open,
  # causing "future Xcode project file format" errors. Pin explicitly to
  # match the Xcode version used in CI (see .github/workflows/ios_build.yml).
  # Xcode 15.x uses project object version 60 (PBXProj format 1).
  xcodeVersion: "15.4"

packages:
  SwiftSDL2:
    url: https://github.com/ctreffs/SwiftSDL2.git
    from: 1.4.0

targets:
  Zelda3iOS:
    type: application
    platform: iOS
    deploymentTarget: "14.7"
    sources:
      - path: Sources/App
      - path: Sources/CEngine
        type: group
        excludes:
          - "**/*.md"
          - "third_party/opus-1.3.1-stripped/x86/**"
          - "third_party/opus-1.3.1-stripped/mips/**"
          - "third_party/opus-1.3.1-stripped/arm/celt_pitch_xcorr_arm.s"
          - "third_party/opus-1.3.1-stripped/arm/celt_pitch_xcorr_arm-gnu.S"
          # These two files require the external NE10 library (NE10_dsp.h),
          # which is not vendored anywhere in this project, so they cannot
          # compile. The generic (non-NEON) opus code paths are used instead;
          # this only affects perf on ARM, not correctness.
          - "third_party/opus-1.3.1-stripped/arm/celt_mdct_ne10.c"
          - "third_party/opus-1.3.1-stripped/arm/celt_fft_ne10.c"
          # This file #includes opus_decoder.c, opus.c, celt.c, cwrs.c, etc.
          # as a single amalgamated translation unit. Those same .c files are
          # also compiled individually elsewhere in this source tree, so
          # including this file too causes duplicate-symbol link errors.
          - "third_party/opus-1.3.1-stripped/opus_decoder_amalgam.c"
    resources:
      # Resources/Info.plist is consumed separately below via `info.path`,
      # not copied as a bundle resource, so it's excluded here. Everything
      # else in Resources/ (e.g. zelda3_assets.bps) gets copied into the
      # app bundle's root — this was previously missing entirely, which is
      # why a .bps dropped into this folder never actually made it into
      # built .ipa and the engine crashed on launch unable to find it.
      - path: Resources
        excludes:
          - "Info.plist"
    dependencies:
      - package: SwiftSDL2
        product: SDL
    info:
      path: Resources/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: true
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIApplicationSupportsIndirectInputEvents: true
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.example.zelda3ios.sfc-rom
            UTTypeDescription: "SNES ROM (SFC)"
            UTTypeConformsTo:
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - sfc
                - smc
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.zelda3ios
        SWIFT_OBJC_BRIDGING_HEADER: Sources/App/Zelda3iOS-Bridging-Header.h
        SWIFT_VERSION: 5.0
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/Sources/CEngine"
          - "$(SRCROOT)/Sources/CEngine/src"
          - "$(SRCROOT)/Sources/CEngine/snes"
          - "$(SRCROOT)/Sources/CEngine/third_party"
          - "$(SRCROOT)/Sources/CEngine/third_party/stb"
          - "$(SRCROOT)/Sources/CEngine/third_party/gl_core"
          - "$(SRCROOT)/Sources/CEngine/third_party/opus-1.3.1-stripped"
          - "$(SRCROOT)/Sources/CEngine/src/platform/ios"
        GCC_PREPROCESSOR_DEFINITIONS:
          - "$(inherited)"
          - "SDL_MAIN_HANDLED=1"
          - "__IPHONEOS__=1"
          - "HAVE_CONFIG_H=1"
          - "USE_ALLOCA=1"
        OTHER_CFLAGS:
          - "-Wno-everything"
        ENABLE_BITCODE: false
        TARGETED_DEVICE_FAMILY: "1,2"
      configs:
        Debug:
          GCC_OPTIMIZATION_LEVEL: 0
        Release:
          GCC_OPTIMIZATION_LEVEL: 3
