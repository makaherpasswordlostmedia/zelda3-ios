name: Build iOS .ipa (armv7, iOS 5+)

on:
  push:
  pull_request:
  workflow_dispatch: {}

jobs:
  build-ios-armv7:
    name: Build (Theos / iOS 5+ / armv7)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Identify commit
        id: commit-info
        run: |
          echo "hash=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "date=$(git log -1 --format=%cd --date=short)" >> $GITHUB_OUTPUT

      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg lsb-release software-properties-common \
                                  build-essential perl curl ca-certificates \
                                  zip unzip xz-utils bzip2 git fakeroot make

      - name: Install Theos + iOS cross toolchain
        env:
          THEOS: ${{ github.workspace }}/theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$THEOS"
          mkdir -p "$THEOS/toolchain/linux/iphone"
          curl -fsSL \
            "https://github.com/L1ghtmann/llvm-project/releases/download/main-update_3-eabca92/iOSToolchain-x86_64.tar.xz" \
            -o /tmp/ios-toolchain.tar.xz
          tar -xf /tmp/ios-toolchain.tar.xz -C "$THEOS/toolchain"
          ls "$THEOS/toolchain/linux/iphone/bin" | head -20
          echo "THEOS=$THEOS" >> $GITHUB_ENV

      - name: Install iPhoneOS 9.3 SDK
        env:
          THEOS: ${{ github.workspace }}/theos
        run: |
          mkdir -p "$THEOS/sdks"
          curl -fsSL -o /tmp/iphoneos9.3.sdk.tbz2 \
            "https://raw.githubusercontent.com/Sn0wCooder/theos-sdks/master/iPhoneOS9.3.sdk.tbz2"
          tar -xjf /tmp/iphoneos9.3.sdk.tbz2 -C "$THEOS/sdks"
          ls "$THEOS/sdks"

      - name: Fix legacy module maps in SDK (clang 19)
        env:
          THEOS: ${{ github.workspace }}/theos
        run: |
          SDK="$THEOS/sdks/iPhoneOS9.3.sdk"
          for fw in "$SDK"/System/Library/Frameworks/*.framework; do
            if [ -f "$fw/module.map" ]; then
              mkdir -p "$fw/Modules"
              mv "$fw/module.map" "$fw/Modules/module.modulemap"
            fi
          done
          find "$SDK/usr/include" -name module.map | while read -r m; do
            mv "$m" "$(dirname "$m")/module.modulemap"
          done
          echo "remaining module.map files:"
          find "$SDK" -name module.map | wc -l

      - name: Apply iOS 5 port (overwrite changed files)
        run: |
          set -e
          mkdir -p $(dirname Makefile)
          cat > Makefile <<'Z3EOF'
          # Zelda3 (armv7 / iOS 5.0+) -- Theos application
          # Built with a newer SDK (9.3 here, any SDK that still ships armv7 works) but with
          # DEPLOYMENT TARGET 5.0: the second number below is what ends up in the Mach-O
          # (LC_VERSION_MIN_IPHONEOS) and MinimumOSVersion in Resources/Info.plist. Every
          # API used by Zelda3/App and Zelda3/Platform was compile-checked against the real
          # iPhoneOS 5.1 SDK, so nothing newer than iOS 5.0 is referenced.
          # Devices: iPhone 3GS/4/4S, iPod touch 3/4, iPad 1/2 on iOS 5.x (jailbroken --
          # see README: iOS 5 cannot run unsigned apps).
          TARGET := iphone:clang:9.3:5.0
          ARCHS = armv7

          # Same clang-19-vs-old-SDK-modulemap workaround as before.
          export ADDITIONAL_OBJCFLAGS += -Wno-error=deprecated-module-dot-map -Wno-deprecated-module-dot-map

          include $(THEOS)/makefiles/common.mk

          APPLICATION_NAME = Zelda3ARMv7

          # Baseline applies to both .c and .m: -fobjc-arc/-fno-objc-arc only affect
          # Objective-C translation units, so it is harmless on the plain-C engine files
          # below -- ARC itself is enabled per-file for the .m files via _FILE_FLAGS,
          # since Theos (like the gnustep-make it is built on) does not expose separate
          # CFLAGS/OBJCFLAGS variables that route to .c vs .m independently.
          Zelda3ARMv7_CFLAGS = -O2 -std=gnu11 -I$(THEOS_PROJECT_DIR)/Zelda3/Engine -I$(THEOS_PROJECT_DIR)/Zelda3/Platform \
          	-I$(THEOS_PROJECT_DIR)/third_party/opus-1.3.1-stripped \
          	-Wno-deprecated-declarations -Wno-unknown-warning-option \
          	-Wno-error=deprecated-module-dot-map -Wno-deprecated-module-dot-map \
          	-Wno-error=nullability-completeness -Wno-nullability-completeness \
          	-Wno-error=unused-command-line-argument -Wno-unused-command-line-argument \
          	-Wno-error=incomplete-umbrella -Wno-incomplete-umbrella \
          	-Wno-error=non-modular-include-in-framework-module \
          	-Wno-non-modular-include-in-framework-module \
          	-Wno-error=non-modular-include-in-module -Wno-non-modular-include-in-module \
          	-Wno-error=bitwise-op-parentheses -Wno-bitwise-op-parentheses \
          	-Wno-error=logical-op-parentheses -Wno-logical-op-parentheses \
          	-Wno-error=parentheses -Wno-parentheses \
          	-Wno-error=unused-variable -Wno-unused-variable \
          	-Wno-error=unused-but-set-variable -Wno-unused-but-set-variable \
          	-Wno-error=deprecated-non-prototype -Wno-deprecated-non-prototype \
          	-mno-unaligned-access -fno-strict-aliasing -fwrapv

          # ARC for every file (-fobjc-arc is ignored for plain C). Theos only honours per-file flags
          # spelled "<file>_CFLAGS"; the old "<file>_FILE_FLAGS" lines below were silently ignored,
          # which is why Z3View.m used to build without ARC.
          Zelda3ARMv7_CFLAGS += -fobjc-arc

          Zelda3ARMv7_FILES = \
          	Zelda3/Engine/src/ancilla.c \
          	Zelda3/Engine/src/attract.c \
          	Zelda3/Engine/src/audio.c \
          	Zelda3/Engine/src/config.c \
          	Zelda3/Engine/src/dungeon.c \
          	Zelda3/Engine/src/ending.c \
          	Zelda3/Engine/src/hud.c \
          	Zelda3/Engine/src/load_gfx.c \
          	Zelda3/Engine/src/messaging.c \
          	Zelda3/Engine/src/misc.c \
          	Zelda3/Engine/src/nmi.c \
          	Zelda3/Engine/src/overlord.c \
          	Zelda3/Engine/src/overworld.c \
          	Zelda3/Engine/src/player.c \
          	Zelda3/Engine/src/player_oam.c \
          	Zelda3/Engine/src/poly.c \
          	Zelda3/Engine/src/select_file.c \
          	Zelda3/Engine/src/spc_player.c \
          	Zelda3/Engine/src/sprite.c \
          	Zelda3/Engine/src/sprite_main.c \
          	Zelda3/Engine/src/tagalong.c \
          	Zelda3/Engine/src/tile_detect.c \
          	Zelda3/Engine/src/util.c \
          	Zelda3/Engine/src/zelda_rtl.c \
          	Zelda3/Engine/snes/apu.c \
          	Zelda3/Engine/snes/dma.c \
          	Zelda3/Engine/snes/dsp.c \
          	Zelda3/Engine/snes/ppu.c \
          	Zelda3/Engine/snes/spc.c \
          	Zelda3/Engine/snes/tracing.c \
          	Zelda3/Engine/keyname.c \
          	third_party/opus-1.3.1-stripped/opus_decoder_amalgam.c \
          	Zelda3/Platform/bus_stubs.c \
          	Zelda3/Platform/Z3Runtime.m \
          	Zelda3/Platform/Z3View.m \
          	Zelda3/Platform/Z3Audio.m \
          	Zelda3/App/AppDelegate.m \
          	Zelda3/App/GameViewController.m \
          	Zelda3/App/TouchButton.m

          # NOTE: intentionally NOT compiled -- see comments where each is referenced:
          #   Engine/src/main.c, opengl.c, glsl_shader.c   (SDL/GL desktop entry point; replaced by Platform/)
          #   Engine/src/zelda_cpu_infra.c                 (reference 65816 emulator: desktop-only ROM
          #                                                  verification harness, never called at runtime)
          #   Engine/snes/{cpu,snes,cart,input,snes_other}.c (belong to that same reference emulator;
          #                                                  their headers are still included for struct
          #                                                  typedefs used by ppu.h/dma.h -- see bus_stubs.c)

          # ARC only for the ObjC platform/app files; the engine core and bus_stubs.c
          # are plain C and unaffected by this flag either way, but being explicit here
          # avoids ever silently ARC-ifying a future .m file added to the engine tree.

          # Third-party (unmodified libopus, stripped-decoder build): the amalgam
          # includes an internal encoder-side stub (ec_encode_bin) and a helper
          # (smooth_fade) that this decoder-only configuration never calls. That's
          # upstream's code shape, not ours to edit, so silence just this warning
          # for just this file rather than patching vendored source.
          third_party/opus-1.3.1-stripped/opus_decoder_amalgam.c_FILE_FLAGS = -Wno-error=unused-function -Wno-unused-function

          Zelda3ARMv7_FRAMEWORKS = UIKit Foundation CoreGraphics QuartzCore AudioToolbox OpenGLES
          Zelda3ARMv7_CODESIGN_FLAGS = -Sentitlements.plist

          include $(THEOS_MAKE_PATH)/application.mk
          Z3EOF
          mkdir -p $(dirname control)
          cat > control <<'Z3EOF'
          Package: org.snesrev.zelda3.armv7
          Name: Zelda3
          Version: 1.0
          Architecture: iphoneos-arm
          Description: The Legend of Zelda: A Link to the Past (zelda3 decompilation), ported to 32-bit iOS 5.0+ / armv7
          Maintainer: Zelda3ARMv7
          Author: Zelda3ARMv7
          Section: Applications
          Depends: firmware (>= 5.0)
          Z3EOF
          mkdir -p $(dirname Resources/Info.plist)
          cat > Resources/Info.plist <<'Z3EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
          	<key>CFBundleDevelopmentRegion</key>
          	<string>en</string>
          	<key>CFBundleExecutable</key>
          	<string>Zelda3ARMv7</string>
          	<key>CFBundleIdentifier</key>
          	<string>org.snesrev.zelda3.armv7</string>
          	<key>CFBundleInfoDictionaryVersion</key>
          	<string>6.0</string>
          	<key>CFBundleName</key>
          	<string>Zelda3</string>
          	<key>CFBundlePackageType</key>
          	<string>APPL</string>
          	<key>CFBundleShortVersionString</key>
          	<string>1.0</string>
          	<key>CFBundleVersion</key>
          	<string>1</string>
          	<key>LSRequiresIPhoneOS</key>
          	<true/>
          	<key>UIDeviceFamily</key>
          	<array>
          		<integer>1</integer>
          		<integer>2</integer>
          	</array>
          	<key>UIRequiredDeviceCapabilities</key>
          	<array>
          		<string>armv7</string>
          		<string>opengles-2</string>
          	</array>
          	<key>UISupportedInterfaceOrientations</key>
          	<array>
          		<string>UIInterfaceOrientationLandscapeLeft</string>
          		<string>UIInterfaceOrientationLandscapeRight</string>
          	</array>
          	<key>UIStatusBarHidden</key>
          	<true/>
          	<key>MinimumOSVersion</key>
          	<string>5.0</string>
          	<key>ITSAppUsesNonExemptEncryption</key>
          	<false/>
          	<!-- The ROM is user-supplied (iTunes File Sharing), so users need to see and
          	     add files in Documents via Finder/iTunes -- and we want zelda3_assets.dat
          	     visible there too so it can be backed up/restored across reinstalls. -->
          	<key>UIFileSharingEnabled</key>
          	<true/>
          	<key>LSSupportsOpeningDocumentsInPlace</key>
          	<false/>
          </dict>
          </plist>
          Z3EOF
          mkdir -p $(dirname Zelda3/App/GameViewController.m)
          cat > Zelda3/App/GameViewController.m <<'Z3EOF'
          // GameViewController.m -- iOS 5.0+ (no UIAlertController, no NSTextAlignment*,
          // no -[NSArray firstObject], no keyed subscripting, no Auto Layout).
          #import "GameViewController.h"
          #import "Z3View.h"
          #import "TouchButton.h"
          #include "Z3Runtime.h"
          #include "Z3Audio.h"

          // Die() may fire on the game thread; the handler hops to the main thread.
          // __unsafe_unretained: no zeroing-weak dependency, cleared in -dealloc.
          static __unsafe_unretained GameViewController *g_currentVC;
          static void FatalHandler(const char *message);

          // UITextAlignmentCenter == 1 on iOS 5, NSTextAlignmentCenter == 2 on iOS 6+. Pick at runtime
          // so it is right on both and compiles against any SDK without enum-conversion errors.
          static inline int Z3AlignCenter(void) {
            return [[[UIDevice currentDevice] systemVersion] floatValue] >= 6.0f ? 2 : 1;
          }

          @implementation GameViewController {
            Z3View *_gameView;
            UILabel *_statusLabel;
            UIButton *_retryButton;
            BOOL _started;

            // On-screen controls, laid out in -viewDidLayoutSubviews because on iOS 5
            // the view still has portrait bounds in -viewDidLoad of a landscape-only app.
            TouchDPad *_dpad;
            TouchButton *_btnA, *_btnB, *_btnX, *_btnY, *_btnL, *_btnR, *_btnSelect, *_btnStart;
          }

          - (void)viewDidLoad {
            [super viewDidLoad];
            g_currentVC = self;
            self.view.backgroundColor = [UIColor blackColor];
            Z3Runtime_SetFatalHandler(FatalHandler);
            [self tryBoot];
          }

          - (void)dealloc {
            if (g_currentVC == self) g_currentVC = nil;
          }

          // iOS 5 (and 6+, where it is deprecated but still honoured as a fallback)
          // decides rotation here; Info.plist alone is not enough on iOS 5.
          - (BOOL)shouldAutorotateToInterfaceOrientation:(UIInterfaceOrientation)o {
            return UIInterfaceOrientationIsLandscape(o);
          }

          static void FatalHandler(const char *message) {
            NSString *msg = [NSString stringWithUTF8String:message ? message : "unknown error"];
            dispatch_async(dispatch_get_main_queue(), ^{
              [g_currentVC showFatalAlert:msg];
            });
          }

          - (NSString *)documentsDir {
            return [NSSearchPathForDirectoriesInDomains(NSDocumentDirectory, NSUserDomainMask, YES) objectAtIndex:0];
          }

          - (void)tryBoot {
            char err[256] = {0};
            int rc = Z3Runtime_Prepare([[self documentsDir] UTF8String],
                                       [[[NSBundle mainBundle] bundlePath] UTF8String], err, sizeof(err));
            if (rc != 0) {
              [self showRomHelp:[NSString stringWithUTF8String:err]];
              return;
            }
            [self startGame];
          }

          - (void)startGame {
            if (_started) return;
            _started = YES;
            [_retryButton removeFromSuperview]; _retryButton = nil;
            [_statusLabel removeFromSuperview]; _statusLabel = nil;

            _gameView = [[Z3View alloc] initWithFrame:self.view.bounds];
            _gameView.autoresizingMask = UIViewAutoresizingFlexibleWidth | UIViewAutoresizingFlexibleHeight;
            [self.view addSubview:_gameView];
            [self buildTouchOverlay];
            [self layoutTouchOverlay];

            Z3Runtime_Start();
            Z3Audio_Start();
            [_gameView start];
          }

          // No ROM yet: iOS 5 has no document picker, so iTunes File Sharing (or SSH/Filza
          // on a jailbroken device) is the only way in.
          - (void)showRomHelp:(NSString *)reason {
            if (!_statusLabel) {
              _statusLabel = [[UILabel alloc] initWithFrame:CGRectZero];
              _statusLabel.numberOfLines = 0;
              _statusLabel.backgroundColor = [UIColor clearColor];
              _statusLabel.textColor = [UIColor whiteColor];
              _statusLabel.textAlignment = Z3AlignCenter();
              _statusLabel.font = [UIFont systemFontOfSize:16];
              [self.view addSubview:_statusLabel];

              _retryButton = [UIButton buttonWithType:UIButtonTypeRoundedRect];
              [_retryButton setTitle:@"Retry" forState:UIControlStateNormal];
              [_retryButton addTarget:self action:@selector(tryBoot) forControlEvents:UIControlEventTouchUpInside];
              [self.view addSubview:_retryButton];
            }
            _statusLabel.text = [NSString stringWithFormat:
                @"%@\n\nConnect the device to a computer, open this app in iTunes > Apps > File Sharing, "
                @"and copy your own zelda3.sfc (US release) into it. Then tap Retry.", reason];
            [self.view setNeedsLayout];
          }

          - (void)showFatalAlert:(NSString *)message {
            UIAlertView *av = [[UIAlertView alloc] initWithTitle:@"Zelda3 stopped"
                                                         message:message
                                                        delegate:nil
                                               cancelButtonTitle:@"OK"
                                               otherButtonTitles:nil];
            [av show];
          }

          - (TouchButton *)addButton:(NSString *)name {
            TouchButton *b = [TouchButton buttonWithLabel:name];
            [self.view addSubview:b];
            return b;
          }

          - (void)buildTouchOverlay {
            _dpad = [[TouchDPad alloc] initWithFrame:CGRectZero];
            [self.view addSubview:_dpad];
            _btnA = [self addButton:@"A"];
            _btnB = [self addButton:@"B"];
            _btnX = [self addButton:@"X"];
            _btnY = [self addButton:@"Y"];
            _btnL = [self addButton:@"L"];
            _btnR = [self addButton:@"R"];
            _btnSelect = [self addButton:@"Select"];
            _btnStart = [self addButton:@"Start"];
          }

          - (void)layoutTouchOverlay {
            if (!_dpad) return;
            CGRect b = self.view.bounds;
            CGFloat w = b.size.width, h = b.size.height;
            CGFloat pad = 16;
            CGFloat s = MAX(56.0, floor(MIN(w, h) * 0.12));   // bigger buttons on iPad

            _dpad.frame = CGRectMake(pad, h - 3 * s - pad, 3 * s, 3 * s);

            CGFloat rx = w - pad - 2.4 * s, ry = h - 2.4 * s - pad;
            _btnA.frame = CGRectMake(rx + 1.2 * s, ry,           s, s);
            _btnB.frame = CGRectMake(rx + 0.6 * s, ry + 0.9 * s, s, s);
            _btnX.frame = CGRectMake(rx + 0.6 * s, ry - 0.9 * s, s, s);
            _btnY.frame = CGRectMake(rx,           ry,           s, s);

            CGFloat sw = MAX(70.0, s * 1.25), sh = MAX(28.0, s * 0.5);
            _btnSelect.frame = CGRectMake(w / 2 - sw - 12, h - sh - 12, sw, sh);
            _btnStart.frame  = CGRectMake(w / 2 + 12,      h - sh - 12, sw, sh);

            CGFloat sb = MAX(60.0, s * 1.1);
            _btnL.frame = CGRectMake(pad,              pad, sb, 36);
            _btnR.frame = CGRectMake(w - pad - sb,     pad, sb, 36);
          }

          - (void)viewDidLayoutSubviews {
            [super viewDidLayoutSubviews];
            CGRect b = self.view.bounds;
            if (_statusLabel) {
              _statusLabel.frame = CGRectMake(24, 24, b.size.width - 48, b.size.height - 110);
              _retryButton.frame = CGRectMake((b.size.width - 120) / 2, b.size.height - 70, 120, 44);
            }
            [self layoutTouchOverlay];
          }

          @end
          Z3EOF
          mkdir -p $(dirname Zelda3/App/TouchButton.m)
          cat > Zelda3/App/TouchButton.m <<'Z3EOF'
          // TouchButton.m
          #import "TouchButton.h"
          #import <QuartzCore/QuartzCore.h>
          #include "Z3Runtime.h"
          #include <stdatomic.h>

          // All touch controls OR their bit into this and call Z3Runtime_SetButtons with
          // the combined result -- a single button's -touchesBegan: must not stomp on
          // bits another button already set, since UIKit delivers each control's
          // touches independently and concurrently.
          static _Atomic uint32_t g_padMask;

          static void UpdateMask(uint32_t bit, BOOL down) {
            uint32_t old, updated;
            do {
              old = atomic_load(&g_padMask);
              updated = down ? (old | bit) : (old & ~bit);
            } while (!atomic_compare_exchange_weak(&g_padMask, &old, updated));
            Z3Runtime_SetButtons(updated);
          }

          // UITextAlignmentCenter == 1 on iOS 5, NSTextAlignmentCenter == 2 on iOS 6+. Pick at runtime
          // so it is right on both and compiles against any SDK without enum-conversion errors.
          static inline int Z3AlignCenter(void) {
            return [[[UIDevice currentDevice] systemVersion] floatValue] >= 6.0f ? 2 : 1;
          }

          @implementation TouchButton {
            uint32_t _bit;
            UILabel *_titleLabel;
          }

          + (instancetype)buttonWithLabel:(NSString *)label {
            TouchButton *b = [[self alloc] initWithFrame:CGRectZero];
            b.label = label;
            return b;
          }

          - (instancetype)initWithFrame:(CGRect)frame {
            if ((self = [super initWithFrame:frame])) {
              self.backgroundColor = [UIColor colorWithWhite:1.0 alpha:0.18];
              self.layer.cornerRadius = 8;
              _titleLabel = [[UILabel alloc] initWithFrame:self.bounds];
              _titleLabel.autoresizingMask = UIViewAutoresizingFlexibleWidth | UIViewAutoresizingFlexibleHeight;
              _titleLabel.textAlignment = Z3AlignCenter();
              _titleLabel.textColor = [UIColor colorWithWhite:1.0 alpha:0.85];
              _titleLabel.font = [UIFont boldSystemFontOfSize:15];
              [self addSubview:_titleLabel];
            }
            return self;
          }

          - (void)setLabel:(NSString *)label {
            _label = label;
            _titleLabel.text = label;
            // Button-name -> engine bit. Kept local to this view instead of a lookup
            // table shared across the app: this file is the only place button labels
            // are chosen or interpreted, so the mapping has exactly one place to change.
            static NSDictionary *map;
            static dispatch_once_t once;
            dispatch_once(&once, ^{
              map = @{ @"A": @(kZ3Btn_A), @"B": @(kZ3Btn_B), @"X": @(kZ3Btn_X), @"Y": @(kZ3Btn_Y),
                       @"L": @(kZ3Btn_L), @"R": @(kZ3Btn_R),
                       @"Start": @(kZ3Btn_Start), @"Select": @(kZ3Btn_Select) };
            });
            _bit = [[map objectForKey:label] unsignedIntValue];
          }

          - (void)touchesBegan:(NSSet *)touches withEvent:(UIEvent *)event {
            self.backgroundColor = [UIColor colorWithWhite:1.0 alpha:0.35];
            UpdateMask(_bit, YES);
          }
          - (void)touchesEnded:(NSSet *)touches withEvent:(UIEvent *)event { [self release_]; }
          - (void)touchesCancelled:(NSSet *)touches withEvent:(UIEvent *)event { [self release_]; }
          - (void)release_ {
            self.backgroundColor = [UIColor colorWithWhite:1.0 alpha:0.18];
            UpdateMask(_bit, NO);
          }

          @end

          @implementation TouchDPad {
            uint32_t _currentBits;
          }

          - (instancetype)initWithFrame:(CGRect)frame {
            if ((self = [super initWithFrame:frame])) {
              self.backgroundColor = [UIColor colorWithWhite:1.0 alpha:0.12];
              self.layer.cornerRadius = 8;
            }
            return self;
          }

          - (uint32_t)bitsForPoint:(CGPoint)pt {
            // Dead zone in the middle third; outer ring split into 8 directions so
            // diagonals (e.g. Up+Right) are reachable the way a real d-pad allows.
            CGPoint c = CGPointMake(self.bounds.size.width / 2, self.bounds.size.height / 2);
            CGFloat dx = pt.x - c.x, dy = pt.y - c.y;
            CGFloat r = MIN(c.x, c.y);
            if (dx * dx + dy * dy < (r * 0.28) * (r * 0.28)) return 0;
            uint32_t bits = 0;
            CGFloat angle = atan2(dy, dx);  // -pi..pi, 0 = right, +pi/2 = down (UIKit y-down)
            CGFloat deg = angle * 180.0 / M_PI;
            if (deg < 0) deg += 360;
            // 8 sectors of 45deg, centered on each cardinal/diagonal direction.
            if (deg >= 337.5 || deg < 22.5)        bits = kZ3Btn_Right;
            else if (deg < 67.5)                   bits = kZ3Btn_Right | kZ3Btn_Down;
            else if (deg < 112.5)                  bits = kZ3Btn_Down;
            else if (deg < 157.5)                  bits = kZ3Btn_Down | kZ3Btn_Left;
            else if (deg < 202.5)                  bits = kZ3Btn_Left;
            else if (deg < 247.5)                  bits = kZ3Btn_Left | kZ3Btn_Up;
            else if (deg < 292.5)                  bits = kZ3Btn_Up;
            else                                   bits = kZ3Btn_Up | kZ3Btn_Right;
            return bits;
          }

          - (void)applyBits:(uint32_t)newBits {
            static const uint32_t kDirMask = kZ3Btn_Up | kZ3Btn_Down | kZ3Btn_Left | kZ3Btn_Right;
            uint32_t old, updated;
            do {
              old = atomic_load(&g_padMask);
              updated = (old & ~kDirMask) | newBits;
            } while (!atomic_compare_exchange_weak(&g_padMask, &old, updated));
            Z3Runtime_SetButtons(updated);
            _currentBits = newBits;
          }

          - (void)touchesBegan:(NSSet *)touches withEvent:(UIEvent *)event {
            [self applyBits:[self bitsForPoint:[touches.anyObject locationInView:self]]];
          }
          - (void)touchesMoved:(NSSet *)touches withEvent:(UIEvent *)event {
            [self applyBits:[self bitsForPoint:[touches.anyObject locationInView:self]]];
          }
          - (void)touchesEnded:(NSSet *)touches withEvent:(UIEvent *)event { [self applyBits:0]; }
          - (void)touchesCancelled:(NSSet *)touches withEvent:(UIEvent *)event { [self applyBits:0]; }

          @end
