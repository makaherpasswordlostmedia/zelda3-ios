name: Build iOS .ipa (armv7, iOS 7+)

on:
  push:
    branches: [32bit-ios]
    paths:
      - "Zelda3/**"
      - "Resources/**"
      - "Makefile"
      - "control"
      - "entitlements.plist"
      - ".github/workflows/ios-build.yml"
  pull_request:
    branches: [main]
    paths:
      - "Zelda3/**"
      - "Resources/**"
      - "Makefile"
      - "control"
      - "entitlements.plist"
      - ".github/workflows/ios-build.yml"
  workflow_dispatch: {}

jobs:
  build-ios-armv7:
    name: Build (Theos / iOS 7+ / armv7)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Identify commit
        id: commit-info
        run: |
          echo "hash=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "date=$(git log -1 --format=%cd --date=short)" >> $GITHUB_OUTPUT

      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg lsb-release software-properties-common \
                                  build-essential perl curl ca-certificates \
                                  zip unzip xz-utils bzip2 git fakeroot make

      - name: Install Theos + iOS cross toolchain
        env:
          THEOS: ${{ github.workspace }}/theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$THEOS"
          mkdir -p "$THEOS/toolchain/linux/iphone"
          curl -fsSL \
            "https://github.com/L1ghtmann/llvm-project/releases/download/main-update_3-eabca92/iOSToolchain-x86_64.tar.xz" \
            -o /tmp/ios-toolchain.tar.xz
          tar -xf /tmp/ios-toolchain.tar.xz -C "$THEOS/toolchain"
          ls "$THEOS/toolchain/linux/iphone/bin" | head -20
          echo "THEOS=$THEOS" >> $GITHUB_ENV

      - name: Install iPhoneOS 9.3 SDK
        env:
          THEOS: ${{ github.workspace }}/theos
        run: |
          mkdir -p "$THEOS/sdks"
          curl -fsSL -o /tmp/iphoneos9.3.sdk.tbz2 \
            "https://raw.githubusercontent.com/Sn0wCooder/theos-sdks/master/iPhoneOS9.3.sdk.tbz2"
          tar -xjf /tmp/iphoneos9.3.sdk.tbz2 -C "$THEOS/sdks"
          ls "$THEOS/sdks"

      - name: Fix legacy module maps in SDK (clang 19)
        env:
          THEOS: ${{ github.workspace }}/theos
        run: |
          SDK="$THEOS/sdks/iPhoneOS9.3.sdk"
          for fw in "$SDK"/System/Library/Frameworks/*.framework; do
            if [ -f "$fw/module.map" ]; then
              mkdir -p "$fw/Modules"
              mv "$fw/module.map" "$fw/Modules/module.modulemap"
            fi
          done
          find "$SDK/usr/include" -name module.map | while read -r m; do
            mv "$m" "$(dirname "$m")/module.modulemap"
          done
          echo "remaining module.map files:"
          find "$SDK" -name module.map | wc -l

      - name: Patch sources (ppu.h layout fix, Z3View stripe fix)
        run: |
          cp -f Zelda3/Engine/snes/ppu.h snes/ppu.h
          python3 - <<'PYEOF'
          import sys
          p = 'Zelda3/Platform/Z3View.m'
          s = open(p, newline='').read()
          crlf = '\r\n' in s
          s = s.replace('\r\n', '\n')

          def rep(old, new, what):
              global s
              if s.count(old) != 1:
                  sys.exit('PATCH FAILED (%s): found %d matches' % (what, s.count(old)))
              s = s.replace(old, new)

          a = s.index('  static const char *kFragmentSrc =')
          b = s.index('  GLuint vs = CompileShader')
          s = s[:a] + r'''  static const char *kFragmentSrc =
                "precision highp float;\n"
                "varying vec2 vTexCoord;\n"
                "uniform sampler2D uTexture;\n"
                "uniform vec2 uTexSize;\n"
                "uniform vec2 uScale;\n"
                "void main() {\n"
                "  vec2 px = vTexCoord * uTexSize;\n"
                "  vec2 base = floor(px);\n"
                "  vec2 f = clamp((px - base - 0.5) * uScale + 0.5, 0.0, 1.0);\n"
                "  vec2 uv = (base + f) / uTexSize;\n"
                "  gl_FragColor = vec4(texture2D(uTexture, uv).bgr, 1.0);\n"
                "}\n";

          ''' + s[b:]

          rep('GLint _aPosition, _aTexCoord, _uTexture;',
              'GLint _aPosition, _aTexCoord, _uTexture, _uTexSize, _uScale;', 'ivars')
          rep('  _uTexture = glGetUniformLocation(_program, "uTexture");',
              '  _uTexture = glGetUniformLocation(_program, "uTexture");\n'
              '  _uTexSize = glGetUniformLocation(_program, "uTexSize");\n'
              '  _uScale = glGetUniformLocation(_program, "uScale");', 'uniform locs')
          rep('glTexParameteri(GL_TEXTURE_2D, GL_TEXTURE_MIN_FILTER, GL_NEAREST);',
              'glTexParameteri(GL_TEXTURE_2D, GL_TEXTURE_MIN_FILTER, GL_LINEAR);', 'min filter')
          rep('glTexParameteri(GL_TEXTURE_2D, GL_TEXTURE_MAG_FILTER, GL_NEAREST);',
              'glTexParameteri(GL_TEXTURE_2D, GL_TEXTURE_MAG_FILTER, GL_LINEAR);', 'mag filter')
          rep('  glUniform1i(_uTexture, 0);',
              '  glUniform1i(_uTexture, 0);\n'
              '  glUniform2f(_uTexSize, (GLfloat)_texW, (GLfloat)_texH);\n'
              '  GLfloat scx = (GLfloat)_fbWidth * sx / (GLfloat)_gameW;\n'
              '  GLfloat scy = (GLfloat)_fbHeight * sy / (GLfloat)_gameH;\n'
              '  glUniform2f(_uScale, scx < 1.0f ? 1.0f : scx, scy < 1.0f ? 1.0f : scy);',
              'uniform set')

          if crlf:
              s = s.replace('\n', '\r\n')
          open(p, 'w', newline='').write(s)
          print('Z3View.m patched OK')
          PYEOF
          grep -c 'uScale' Zelda3/Platform/Z3View.m

      - name: Patch for iOS 7 (deployment target, alert fallback)
        run: |
          sed -i 's/^TARGET := iphone:clang:9.3:9.3/TARGET := iphone:clang:9.3:7.0/' Makefile
          sed -i 's/firmware (>= 9.3)/firmware (>= 7.0)/' control
          python3 - <<'PYEOF'
          import re, sys

          def load(p):
              raw = open(p, newline='').read()
              return ('\r\n' in raw), raw.replace('\r\n', '\n')

          def save(p, s, crlf):
              open(p, 'w', newline='').write(s.replace('\n', '\r\n') if crlf else s)

          p = 'Resources/Info.plist'
          crlf, s = load(p)
          s, n = re.subn(r'(<key>MinimumOSVersion</key>\s*<string>)9\.3(</string>)',
                         r'\g<1>7.0\g<2>', s)
          if n != 1:
              sys.exit('PATCH FAILED (MinimumOSVersion)')
          save(p, s, crlf)

          p = 'Zelda3/App/GameViewController.m'
          crlf, s = load(p)
          a = s.index('- (void)showFatalAlert:(NSString *)message {')
          b = s.index('- (void)buildTouchOverlay')
          new_fn = '\n'.join([
              '- (void)showFatalAlert:(NSString *)message {',
              '#pragma clang diagnostic push',
              '#pragma clang diagnostic ignored "-Wunguarded-availability"',
              '#pragma clang diagnostic ignored "-Wunguarded-availability-new"',
              '#pragma clang diagnostic ignored "-Wdeprecated-declarations"',
              '  if (NSClassFromString(@"UIAlertController")) {',
              '    UIAlertController *ac = [UIAlertController alertControllerWithTitle:@"Zelda3 crashed"',
              '        message:message preferredStyle:UIAlertControllerStyleAlert];',
              '    [ac addAction:[UIAlertAction actionWithTitle:@"OK" style:UIAlertActionStyleDefault handler:nil]];',
              '    [self presentViewController:ac animated:YES completion:nil];',
              '  } else {',
              '    // iOS 7: no UIAlertController.',
              '    UIAlertView *av = [[UIAlertView alloc] initWithTitle:@"Zelda3 crashed" message:message',
              '        delegate:nil cancelButtonTitle:@"OK" otherButtonTitles:nil];',
              '    [av show];',
              '  }',
              '#pragma clang diagnostic pop',
              '}',
              '', ''])
          s = s[:a] + new_fn + s[b:]
          save(p, s, crlf)
          print('iOS 7 patch OK')
          PYEOF
          grep -n '^TARGET' Makefile

      - name: Build .deb + .app via Theos
        env:
          THEOS: ${{ github.workspace }}/theos
          FINALPACKAGE: "1"
        run: |
          make clean
          make package FINALPACKAGE=1
          ls -la packages

      - name: Pack .ipa from staged .app
        run: |
          rm -rf ipa_build
          mkdir -p ipa_build/Payload
          APP_DIR=".theos/obj/Zelda3ARMv7.app"
          if [ ! -d "$APP_DIR" ]; then
            APP_DIR=".theos/obj/armv7/Zelda3ARMv7.app"
          fi
          if [ ! -d "$APP_DIR" ]; then
            APP_DIR="$(find .theos -type d -name 'Zelda3ARMv7.app' | head -n1)"
          fi
          echo "Using APP_DIR=$APP_DIR"
          cp -a "$APP_DIR" ipa_build/Payload/
          (cd ipa_build && zip -rq ../packages/Zelda3-${{ steps.commit-info.outputs.hash }}-armv7-iOS7.ipa Payload)
          ls -la packages

      - name: Upload .ipa + .deb artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Zelda3-armv7-iOS7-${{ steps.commit-info.outputs.hash }}
          path: |
            packages/*.ipa
            packages/*.deb
          if-no-files-found: error
          retention-days: 30
