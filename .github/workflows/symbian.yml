            SDLK_o = 111, SDLK_p = 112, SDLK_r = 114, SDLK_s = 115, SDLK_t = 116, SDLK_v = 118,
            SDLK_w = 119, SDLK_x = 120, SDLK_z = 122,
            SDLK_F1 = Z3_SC(58), SDLK_F2 = Z3_SC(59), SDLK_F3 = Z3_SC(60), SDLK_F4 = Z3_SC(61),
            SDLK_F5 = Z3_SC(62), SDLK_F6 = Z3_SC(63), SDLK_F7 = Z3_SC(64), SDLK_F8 = Z3_SC(65),
            SDLK_F9 = Z3_SC(66), SDLK_F10 = Z3_SC(67),
            SDLK_RIGHT = Z3_SC(79), SDLK_LEFT = Z3_SC(80), SDLK_DOWN = Z3_SC(81), SDLK_UP = Z3_SC(82),
            SDLK_LCTRL = Z3_SC(224), SDLK_LSHIFT = Z3_SC(225), SDLK_LALT = Z3_SC(226),
            SDLK_RCTRL = Z3_SC(228), SDLK_RSHIFT = Z3_SC(229), SDLK_RALT = Z3_SC(230)
