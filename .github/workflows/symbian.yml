          #endif
          Z3_EOF
          mkdir -p symbian/core
          cat > symbian/core/opus_stub.c <<'Z3_EOF'
          // MSU (Opus) audio is not supported on Symbian: link-time stubs for audio.c.
          #include <stdarg.h>
          #include <stddef.h>
          #include "third_party/opus-1.3.1-stripped/opus.h"

          OpusDecoder *opus_decoder_create(opus_int32 Fs, int channels, int *error) {
            (void)Fs; (void)channels;
            if (error) *error = OPUS_ALLOC_FAIL;
            return NULL;
          }

          void opus_decoder_destroy(OpusDecoder *st) {
            (void)st;
          }

          int opus_decoder_ctl(OpusDecoder *st, int request, ...) {
            (void)st; (void)request;
            return OPUS_UNIMPLEMENTED;
          }

          int opus_decode(OpusDecoder *st, const unsigned char *data, opus_int32 len,
                          opus_int16 *pcm, int frame_size, int decode_fec) {
            (void)st; (void)data; (void)len; (void)pcm; (void)frame_size; (void)decode_fec;
            return OPUS_UNIMPLEMENTED;
          }
          Z3_EOF
          mkdir -p symbian/core
          cat > symbian/core/z3_platform.c <<'Z3_EOF'
          // z3_platform.c - replaces src/main.c on Symbian: no SDL, the front end drives the frame loop.
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <setjmp.h>
          #include <unistd.h>
          #include <sys/stat.h>
          #include <sys/types.h>

          #include "snes/ppu.h"
          #include "src/types.h"
          #include "src/variables.h"
          #include "src/zelda_rtl.h"
          #include "src/zelda_cpu_infra.h"
          #include "src/config.h"
          #include "src/assets.h"
          #include "src/load_gfx.h"
          #include "src/util.h"
          #include "src/audio.h"
          #include "z3_platform.h"

          enum { kDefaultFreq = 32000, kDefaultChannels = 2 };

          static jmp_buf g_jmp;
          static int g_jmp_armed;
          static int g_dead;
          static int g_inited;
          static char g_err[160];

          static int g_snes_width, g_snes_height;
          static int g_ppu_render_flags;
          static int g_frames_per_block;
          static int g_audio_channels;
          static int g_audio_enabled;

          const uint8 *g_asset_ptrs[kNumberOfAssets];
          uint32 g_asset_sizes[kNumberOfAssets];

          void NORETURN Die(const char *error) {
            strncpy(g_err, error ? error : "error", sizeof(g_err) - 1);
            g_err[sizeof(g_err) - 1] = 0;
            fprintf(stderr, "Error: %s\n", g_err);
            if (g_jmp_armed) {
              g_jmp_armed = 0;
              longjmp(g_jmp, 1);
            }
            exit(1);
          }

          // The front end is single threaded: audio is rendered from the frame loop, so no locking.
          void ZeldaApuLock() {}
          void ZeldaApuUnlock() {}

          const char *Z3_LastError(void) { return g_err; }
          int Z3_Width(void) { return g_snes_width; }
          int Z3_Height(void) { return g_snes_height; }
          int Z3_AudioRate(void) { return g_config.audio_freq; }
          int Z3_AudioChannels(void) { return g_audio_channels; }
          int Z3_AudioFrames(void) { return g_frames_per_block; }
          int Z3_AudioEnabled(void) { return g_audio_enabled; }

          MemBlk FindInAssetArray(int asset, int idx) {
            return FindIndexInMemblk((MemBlk) { g_asset_ptrs[asset], g_asset_sizes[asset] }, idx);
          }

          static uint32 ReadLE32(const uint8 *p) {
            return (uint32)p[0] | ((uint32)p[1] << 8) | ((uint32)p[2] << 16) | ((uint32)p[3] << 24);
          }

          // Same logic as LoadAssets() in main.c: zelda3_assets.dat, or zelda3_assets.bps applied to zelda3.sfc.
          static void LoadAssets(void) {
            size_t length = 0;
            uint8 *data = ReadWholeFile("zelda3_assets.dat", &length);
            if (!data) {
              size_t bps_length = 0, bps_src_length = 0;
              uint8 *bps = ReadWholeFile("zelda3_assets.bps", &bps_length);
              if (!bps)
                Die("zelda3_assets.dat / zelda3_assets.bps not found in the game folder.");
              uint8 *bps_src = ReadWholeFile("zelda3.sfc", &bps_src_length);
              if (!bps_src)
                Die("zelda3.sfc (US ROM) not found in the game folder.");
              data = ApplyBps(bps_src, bps_src_length, bps, bps_length, &length);
              free(bps);
              free(bps_src);
              if (!data)
                Die("zelda3_assets.bps does not match this zelda3.sfc. Use the US ROM.");
            }
            static const char kAssetsSig[] = { kAssets_Sig };
            if (length < 16 + 32 + 32 + 8 + kNumberOfAssets * 4 ||
                memcmp(data, kAssetsSig, 48) != 0 ||
                ReadLE32(data + 80) != kNumberOfAssets)
              Die("Invalid assets file.");
            uint32 offset = 88 + kNumberOfAssets * 4 + ReadLE32(data + 84);
            for (size_t i = 0; i < kNumberOfAssets; i++) {
              uint32 size = ReadLE32(data + 88 + i * 4);
              offset = (offset + 3) & ~3u;
              if ((uint64)offset + size > length)
                Die("Assets file is corrupt.");
              g_asset_sizes[i] = size;
              g_asset_ptrs[i] = data + offset;
              offset += size;
            }
            if (g_config.features0 & kFeatures0_DimFlashes) {  // patch dungeon floor palettes
              kPalette_DungBgMain[0x484] = 0x70;
              kPalette_DungBgMain[0x485] = 0x95;
              kPalette_DungBgMain[0x486] = 0x57;
            }
          }

          int Z3_Init(const char *basedir) {
            if (g_inited) return 0;
            g_err[0] = 0;
            if (setjmp(g_jmp)) {
              g_dead = 1;
              return -1;
            }
            g_jmp_armed = 1;

            if (basedir && chdir(basedir) != 0)
              Die("Cannot open the game folder.");
            mkdir("saves", 0755);

            ParseConfigFile(NULL);
            if (g_config.audio_freq < 8000 || g_config.audio_freq > 48000)
              g_config.audio_freq = kDefaultFreq;
            if (g_config.audio_channels < 1 || g_config.audio_channels > 2)
              g_config.audio_channels = kDefaultChannels;

            LoadAssets();
            ZeldaInitialize();

            g_zenv.ppu->extraLeftRight = UintMin(g_config.extended_aspect_ratio, kPpuExtraLeftRight);
            g_snes_width = g_config.extended_aspect_ratio * 2 + 256;
            g_snes_height = g_config.extend_y ? 240 : 224;

            g_wanted_zelda_features = g_config.features0;
            g_ppu_render_flags = g_config.new_renderer * kPpuRenderFlags_NewRenderer |
                                 g_config.extend_y * kPpuRenderFlags_Height240 |
                                 g_config.no_sprite_limits * kPpuRenderFlags_NoSpriteLimits;
            // enhanced mode7 (4x4 scale) and MSU are not supported on this front end.
            ZeldaEnableMsu(0);
            ZeldaSetLanguage(g_config.language);

            g_audio_enabled = g_config.enable_audio;
            g_audio_channels = g_config.audio_channels;
            g_frames_per_block = (534 * g_config.audio_freq) / 32000;

            ZeldaReadSram();
            g_inited = 1;
            g_jmp_armed = 0;
            return 0;
          }

          int Z3_RunFrame(int pad_bits) {
            if (g_dead || !g_inited) return -1;
            if (setjmp(g_jmp)) {
              g_dead = 1;
              return -1;
            }
            g_jmp_armed = 1;
            ZeldaRunFrame(pad_bits);
            g_jmp_armed = 0;
            return 0;
          }

          int Z3_DrawFrame(unsigned char *pixels, int pitch) {
            if (g_dead || !g_inited) return -1;
            if (setjmp(g_jmp)) {
              g_dead = 1;
              return -1;
            }
            g_jmp_armed = 1;
            ZeldaDrawPpuFrame(pixels, (size_t)pitch, g_ppu_render_flags);
            g_jmp_armed = 0;
            return 0;
          }

          int Z3_RenderAudio(short *out) {
            if (g_dead || !g_inited) return 0;
            ZeldaRenderAudio((int16 *)out, g_frames_per_block, g_audio_channels);
            ZeldaDiscardUnusedAudioFrames();
            return g_frames_per_block;
          }

          void Z3_Command(int cmd, int arg) {
            if (g_dead || !g_inited) return;
            if (setjmp(g_jmp)) {
              g_dead = 1;
              return;
            }
            g_jmp_armed = 1;
            switch (cmd) {
            case Z3_CMD_RESET: ZeldaReset(true); break;
            case Z3_CMD_SAVE: SaveLoadSlot(kSaveLoad_Save, arg); break;
            case Z3_CMD_LOAD: SaveLoadSlot(kSaveLoad_Load, arg); break;
            case Z3_CMD_CHEAT_LIFE: PatchCommand(0x77 /* w */); break;
            case Z3_CMD_CHEAT_EQUIP: PatchCommand(0x57 /* W */); break;
            default: break;
            }
            g_jmp_armed = 0;
          }

          void Z3_Shutdown(void) {
            g_inited = 0;
          }
          Z3_EOF
          mkdir -p symbian/core
          cat > symbian/core/z3_platform.h <<'Z3_EOF'
          // z3_platform.h - C interface between the zelda3 core and the Symbian front end.
          #ifndef Z3_PLATFORM_H
          #define Z3_PLATFORM_H

          #ifdef __cplusplus
          extern "C" {
          #endif

          /* SNES joypad bit layout (same as g_input1_state in the desktop build). */
          enum {
            Z3_PAD_B = 1 << 0, Z3_PAD_Y = 1 << 1, Z3_PAD_SELECT = 1 << 2, Z3_PAD_START = 1 << 3,
            Z3_PAD_UP = 1 << 4, Z3_PAD_DOWN = 1 << 5, Z3_PAD_LEFT = 1 << 6, Z3_PAD_RIGHT = 1 << 7,
            Z3_PAD_A = 1 << 8, Z3_PAD_X = 1 << 9, Z3_PAD_L = 1 << 10, Z3_PAD_R = 1 << 11
          };

          enum { Z3_CMD_RESET = 1, Z3_CMD_SAVE = 2, Z3_CMD_LOAD = 3, Z3_CMD_CHEAT_LIFE = 4, Z3_CMD_CHEAT_EQUIP = 5 };

          /* Load config + assets, start the game. basedir is a path such as "E:/zelda3".
             Returns 0 on success; otherwise Z3_LastError() describes what went wrong. */
          int Z3_Init(const char *basedir);
          const char *Z3_LastError(void);

          int Z3_Width(void);          /* output size in pixels */
          int Z3_Height(void);
          int Z3_AudioRate(void);      /* Hz */
          int Z3_AudioChannels(void);  /* 1 or 2 */
          int Z3_AudioFrames(void);    /* sample frames produced per emulated frame */
          int Z3_AudioEnabled(void);

          /* One emulated frame. Returns 0, or -1 if the game aborted. */
          int Z3_RunFrame(int pad_bits);
          /* Renders the current PPU state into a 32-bit 0x00RRGGBB buffer. */
          int Z3_DrawFrame(unsigned char *pixels, int pitch);
          /* Renders one frame of audio; out holds Z3_AudioFrames()*Z3_AudioChannels() samples. */
          int Z3_RenderAudio(short *out);

          void Z3_Command(int cmd, int arg);
          void Z3_Shutdown(void);

          #ifdef __cplusplus
          }
          #endif
          #endif
          Z3_EOF
          mkdir -p symbian/tools
          cat > symbian/tools/host_check.c <<'Z3_EOF'
          #include "z3_platform.h"
          #include <stdio.h>
          int main(int argc, char **argv) {
            if (Z3_Init(argc > 1 ? argv[1] : 0)) { printf("init failed: %s\n", Z3_LastError()); return 1; }
            static unsigned char px[512*4*240];
            for (int i = 0; i < 120; i++) { Z3_RunFrame(0); Z3_DrawFrame(px, Z3_Width()*4); short a[2048]; Z3_RenderAudio(a); }
            printf("ok %dx%d\n", Z3_Width(), Z3_Height());
            return 0;
          }
          Z3_EOF
          mkdir -p symbian/tools
          cat > symbian/tools/patch_symbian.py <<'Z3_EOF'
          #!/usr/bin/env python3
          """Prepares the zelda3 sources for the Symbian^3 build (run from the repo root).

          * makes WORD()/DWORD()/load24() and raw (u)int16/32/64 pointer casts alignment-safe (ARM)
          * writes symbian/zelda3.ini (device defaults)
          * writes symbian/app/group/zelda3.mmp from symbian/app/group/zelda3.mmp.in + the source list
          """
          import glob, os, re, sys

          def rd(p): return open(p, newline="").read()
          def wr(p, s): open(p, "w", newline="").write(s)

          EXCLUDE = {"src/main.c", "src/opengl.c", "src/glsl_shader.c"}

          # ---------------------------------------------------------------- types.h
          s = rd("src/types.h")
          if "uint16_ua" not in s:
              nl = "\r\n" if "\r\n" in s else "\n"
              anchor = "typedef unsigned int uint;" + nl
              assert anchor in s, "types.h anchor not found"
              s = s.replace(anchor, anchor +
                  "typedef uint16_t uint16_ua __attribute__((aligned(1)));" + nl +
                  "typedef int16_t  int16_ua  __attribute__((aligned(1)));" + nl +
                  "typedef uint32_t uint32_ua __attribute__((aligned(1)));" + nl +
                  "typedef int32_t  int32_ua  __attribute__((aligned(1)));" + nl +
                  "typedef uint64_t uint64_ua __attribute__((aligned(1)));" + nl, 1)
              for a, b in [("(*(uint32*)&(x))&0xffffff", "(*(uint32_ua*)&(x))&0xffffff"),
                           ("#define WORD(x) (*(uint16*)&(x))", "#define WORD(x) (*(uint16_ua*)&(x))"),
                           ("#define DWORD(x) (*(uint32*)&(x))", "#define DWORD(x) (*(uint32_ua*)&(x))")]:
                  assert a in s, a
                  s = s.replace(a, b)
              wr("src/types.h", s)

          pat = re.compile(r"\((u?int(?:16|32|64))\s*\*\)")
          decl = re.compile(r"\b(const\s+)?(u?int(?:16|32|64))\s*\*\s*(\w+)\s*=\s*\((u?int(?:16|32|64)_ua)\*\)")
          skip = ("types.h", "ppu.c")          # ppu.c only touches aligned buffers (and is hot)
          changed = 0
          for f in glob.glob("src/*.c") + glob.glob("src/*.h") + glob.glob("snes/*.c") + glob.glob("snes/*.h"):
              if os.path.basename(f) in skip or f in EXCLUDE:
                  continue
              s = rd(f)
              t = pat.sub(lambda m: "(%s_ua*)" % m.group(1), s)
              t = decl.sub(lambda m: "%s%s_ua *%s = (%s*)" % (m.group(1) or "", m.group(2), m.group(3), m.group(4)), t)
              if t != s:
                  wr(f, t); changed += 1
          print("alignment patch: %d files" % changed)

          # ---------------------------------------------------------------- ini
          ini = rd("zelda3.ini")
          for key, val in [("EnhancedMode7", "0"), ("NoSpriteLimits", "0"), ("AudioFreq", "32000"),
                           ("AudioChannels", "2"), ("NewRenderer", "1"), ("EnableAudio", "1"),
                           ("EnableMSU", "false"), ("Autosave", "0"), ("DisplayPerfInTitle", "0")]:
              ini = re.sub(r"(?m)^(%s\s*=\s*)[^\r\n]*" % key, lambda m: m.group(1) + val, ini, count=1)
          os.makedirs("symbian", exist_ok=True)
          wr("symbian/zelda3.ini", ini)

          # ---------------------------------------------------------------- mmp
          srcs = [f.replace("\\", "/") for f in sorted(glob.glob("src/*.c") + glob.glob("snes/*.c"))
                  if f.replace("\\", "/") not in EXCLUDE]
          names = [os.path.basename(f) for f in srcs] + ["z3_platform.c", "opus_stub.c"]
          dup = sorted(set(n for n in names if names.count(n) > 1))
          assert not dup, "duplicate object names: %s" % dup

          lines = []
          for d in ("src", "snes"):
              lines.append("SOURCEPATH      ../../../%s" % d)
              lines += ["SOURCE          %s" % os.path.basename(f) for f in srcs if f.startswith(d + "/")]
              lines.append("")
          tmpl = open("symbian/app/group/zelda3.mmp.in").read()
          open("symbian/app/group/zelda3.mmp", "w").write(tmpl.replace("@CORE_SOURCES@", "\n".join(lines)))
          print("mmp: %d C sources" % len(srcs))
          Z3_EOF
          BPS=$(find . -name zelda3_assets.bps -not -path "./symbian/*" | head -1)
          test -n "$BPS" || { echo "zelda3_assets.bps not found in repo"; exit 1; }
          cp "$BPS" symbian/app/sis/zelda3_assets.bps
          python3 symbian/tools/patch_symbian.py
          cp symbian/zelda3.ini symbian/app/sis/zelda3.ini
      - uses: actions/upload-artifact@v4
        with:
          name: port-src
          path: |
            src
            snes
            third_party
            symbian

  host-check:
    name: Core build check (host)
    needs: sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: port-src
          path: .
      - name: Compile and link the core without SDL
        run: |
          mkdir obj
          FL="-std=gnu11 -O1 -fno-strict-aliasing -fwrapv -w -DNDEBUG -DZ3_SYMBIAN -I. -Isymbian/core -Isymbian/compat"
          for f in src/*.c snes/*.c symbian/core/*.c symbian/tools/host_check.c; do
            case $f in src/main.c|src/opengl.c|src/glsl_shader.c) continue;; esac
            gcc $FL -c $f -o obj/$(basename $f .c).o
          done
          gcc obj/*.o -o host_check -lm
          mkdir empty && ./host_check "$PWD/empty" 2>&1 | tail -2 || true

  build-sis:
    name: Build zelda3.sisx
    needs: sources
    runs-on: ${{ vars.MACOS_RUNNER || 'macos-latest' }}
    timeout-minutes: 360
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: port-src
          path: .
      - name: Check out symbian3-toolchain
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TOOLCHAIN_REPO }}
          ref: ${{ env.TOOLCHAIN_REF }}
          path: toolchain
      - name: Create case-sensitive APFS volume
        run: |
          hdiutil create -size 24g -fs "Case-sensitive APFS" -volname Symbian -type SPARSE "$RUNNER_TEMP/symbian"
          hdiutil attach "$RUNNER_TEMP/symbian.sparseimage" -mountpoint "$SYMBIAN_VOL"
          sudo chown "$(id -u):$(id -g)" "$SYMBIAN_VOL"
      - name: Install Homebrew dependencies and Rosetta
        run: |
          brew install perl openssl@3 unshield make gmp mpfr libmpc isl gnu-sed
          brew unlink perl
          sudo softwareupdate --install-rosetta --agree-to-license || true
      - name: Restore toolchain cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            /Volumes/Symbian/toolchain
            /Volumes/Symbian/sdks
            /Volumes/Symbian/gnupoc
          key: symbian3-toolchain-${{ env.TOOLCHAIN_REF }}-${{ env.GNUPOC_COMMIT }}-${{ env.GCC4SYMBIAN_COMMIT }}
      - name: Build toolchain and install SDK (cache miss)
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          JOBS: 4
        run: |
          set -eo pipefail
          cd toolchain
          source Scripts/env.sh
          mkdir -p "$N8_SRC"
          git clone https://github.com/mstorsjo/gnupoc-package "$N8_SRC/gnupoc-package"
          git -C "$N8_SRC/gnupoc-package" checkout "$GNUPOC_COMMIT"
          git clone https://github.com/fedor4ever/GCC4Symbian "$N8_SRC/GCC4Symbian"
          git -C "$N8_SRC/GCC4Symbian" checkout "$GCC4SYMBIAN_COMMIT"
          Scripts/fetch-sdk.sh
          Scripts/build-host-tools.sh
          Scripts/build-gcc.sh
          Scripts/install-sdk.sh
      - name: Save toolchain cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            /Volumes/Symbian/toolchain
            /Volumes/Symbian/sdks
            /Volumes/Symbian/gnupoc
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Check Open C (libc) in the SDK
        run: |
          source toolchain/Scripts/env.sh
          ls "${EPOCROOT}epoc32/include/stdapis/stdio.h" "${EPOCROOT}epoc32/include/stdapis/stdint.h" || true
          ls "${EPOCROOT}epoc32/release/armv5/lib/" | grep -i "^lib[cm]\\." || true
          arm-none-symbianelf-gcc -print-file-name=include
      - name: Build zelda3
        run: |
          set -eo pipefail
          source toolchain/Scripts/env.sh
          GCCINC="$(arm-none-symbianelf-gcc -print-file-name=include)"
          cd symbian/app/group
          sed -i.bak "s|@GCCINC@|$GCCINC|" zelda3.mmp
          bldmake bldfiles
          if ! abld build -keepgoing gcce urel; then
            echo "::warning::build failed, retrying without multi-touch (Z3_MULTITOUCH)"
            sed -i.bak2 "/Z3_MULTITOUCH/d" zelda3.mmp
            abld reallyclean gcce urel || true
            bldmake bldfiles
            abld build gcce urel
          fi
          test -f "${EPOCROOT}epoc32/release/gcce/urel/zelda3.exe"
      - name: Package signed SIS
        run: |
          set -eo pipefail
          source toolchain/Scripts/env.sh
          mkdir -p "$GITHUB_WORKSPACE/dist"
          "$N8_REPO/Scripts/package-sis.sh" symbian/app/sis/zelda3.pkg "$GITHUB_WORKSPACE/dist"
          ls -l "$GITHUB_WORKSPACE/dist"
      - uses: actions/upload-artifact@v4
        with:
          name: zelda3-symbian3
          path: dist/zelda3.sisx
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/zelda3.sisx
