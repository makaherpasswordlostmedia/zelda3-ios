name: Build Symbian^3 SIS (Zelda3)

# SELF-CONTAINED: this single file carries the whole Symbian port (symbian/ tree) and patches the
# zelda3 sources at build time. Toolchain: https://github.com/fieldops-dev/symbian3-toolchain
# (Apple Silicon runner; first run builds GCC ~2h and caches it).

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  TOOLCHAIN_REPO: fieldops-dev/symbian3-toolchain
  TOOLCHAIN_REF: a96f917e6c8f02fe4f7c2186f8df760d3d9d832a
  SYMBIAN_VOL: /Volumes/Symbian
  GNUPOC_COMMIT: d3ddaf58c734ad3ab34dc60a012f9d4768a9ed3e
  GCC4SYMBIAN_COMMIT: fe1b15a1c25716d5c515f12593080d58f14d4c3f

jobs:
  sources:
    name: Write port sources and patch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate symbian/ tree and patch sources
        run: |
          set -e
          mkdir -p symbian
          true
          cat > symbian/README.md <<'Z3_EOF'
          # Zelda3 for Symbian^3

          Native Symbian^3 (Nokia N8, C7, E7, ...) port of the zelda3 C reimplementation. Built entirely by
          `.github/workflows/symbian.yml` (it carries the whole port and patches the sources at build time).

          * `core/z3_platform.c` replaces `src/main.c` (no SDL): config, asset loading, frame/draw/audio entry points.
          * `app/` Avkon front end: multi-touch pad, overlay menu, MMF audio (32 kHz stereo), `bld.inf`/`.mmp`/`.pkg`.
          * `compat/` tiny SDL key shim for `config.c`; `core/opus_stub.c` (MSU not supported).
          * `tools/patch_symbian.py` makes the sources ARM-alignment-safe, writes the `.ini` and the `.mmp`.

          ## Install
          Install `zelda3.sisx`, then copy your US ROM as `zelda3.sfc` into the `zelda3` folder created on the drive
          you installed to (e.g. `E:\zelda3\`). On first start the bundled `zelda3_assets.bps` is applied to the ROM.
          Saves go to `zelda3\saves\`. Edit `zelda3\zelda3.ini` for options (`ExtendedAspectRatio = 16:9` etc).

          Controls: touch pad (multi-touch), or keys: arrows, X=A, Z=B, S=X, A=Y, C=L, V=R, Enter=Start, Space=Select,
          left soft key = menu.

          ## Status
          Core links and the error paths were tested on a desktop. The Symbian layer has not been compiled against the
          real SDK or run on a device: expect small fixes on the first CI run.
          Z3_EOF
          mkdir -p symbian/app/data
          cat > symbian/app/data/zelda3.rss <<'Z3_EOF'
          NAME ZEL3

          #include <eikon.rh>
          #include <avkon.rh>
          #include <avkon.rsg>
          #include <appinfo.rh>

          RESOURCE RSS_SIGNATURE { }

          RESOURCE TBUF r_default_document_name { buf = ""; }

          RESOURCE EIK_APP_INFO
              {
              }

          RESOURCE LOCALISABLE_APP_INFO r_localisable_app_info
              {
              short_caption = "Zelda3";
              caption_and_icon = CAPTION_AND_ICON_INFO
                  {
                  caption = "Zelda3";
                  number_of_icons = 0;
                  };
              }
          Z3_EOF
          mkdir -p symbian/app/data
          cat > symbian/app/data/zelda3_reg.rss <<'Z3_EOF'
          #include <appinfo.rh>
          #include <zelda3.rsg>

          UID2 KUidAppRegistrationResourceFile
          UID3 0xE1A5B3DA

          RESOURCE APP_REGISTRATION_INFO
              {
              app_file = "zelda3";
              localisable_resource_file = "\\resource\\apps\\zelda3";
              localisable_resource_id = R_LOCALISABLE_APP_INFO;
              embeddability = KAppNotEmbeddable;
              newfile = KAppDoesNotSupportNewFile;
              }
          Z3_EOF
          mkdir -p symbian/app/group
          cat > symbian/app/group/bld.inf <<'Z3_EOF'
          PRJ_PLATFORMS
          DEFAULT

          PRJ_MMPFILES
          zelda3.mmp
          Z3_EOF
          mkdir -p symbian/app/group
          cat > symbian/app/group/zelda3.mmp.in <<'Z3_EOF'
          // Zelda3 (A Link to the Past C port) for Symbian^3.
          // zelda3.mmp is generated from this file by symbian/tools/patch_symbian.py.
          #include <platform_paths.hrh>

          TARGET          zelda3.exe
          TARGETTYPE      exe
          UID             0x100039CE 0xE1A5B3DA
          SECUREID        0xE1A5B3DA
          VENDORID        0
          CAPABILITY      NONE

          EPOCSTACKSIZE   0x80000
          EPOCHEAPSIZE    0x400000 0x4000000

          MACRO           NDEBUG
          MACRO           Z3_SYMBIAN
          MACRO           Z3_MULTITOUCH
          MACRO           SYSTEM_VOLUME_MIXER_AVAILABLE=0

          SOURCEPATH      ../src
          SOURCE          zelda3_app.cpp
          SOURCE          zelda3_appui.cpp
          SOURCE          zelda3_container.cpp
          SOURCE          zelda3_audio.cpp

          SOURCEPATH      ../../core
          SOURCE          z3_platform.c
          SOURCE          opus_stub.c

          @CORE_SOURCES@
          USERINCLUDE     ../inc
          USERINCLUDE     ../../core
          USERINCLUDE     ../../compat
          USERINCLUDE     ../../..
          SYSTEMINCLUDE   /epoc32/include/stdapis
          APP_LAYER_SYSTEMINCLUDE

          SOURCEPATH      ../data
          START RESOURCE  zelda3.rss
          HEADER
          TARGETPATH      /resource/apps
          END

          START RESOURCE  zelda3_reg.rss
          TARGETPATH      /private/10003a3f/import/apps
          END

          LIBRARY         euser.lib apparc.lib cone.lib eikcore.lib avkon.lib eikcoctl.lib
          LIBRARY         fbscli.lib bitgdi.lib gdi.lib ws32.lib efsrv.lib
          LIBRARY         mediaclientaudiostream.lib bafl.lib
          LIBRARY         libc.lib libm.lib

          // The game core type-puns heavily and wraps on signed overflow; ARM must not do unaligned accesses.
          OPTION          GCCE -O2 -fno-strict-aliasing -fwrapv -mno-unaligned-access
          OPTION          GCCE -Wno-error=implicit-function-declaration -Wno-error=int-conversion
          OPTION          GCCE -Wno-error=incompatible-pointer-types -Wno-error=implicit-int
          OPTION          GCCE -idirafter @GCCINC@
          Z3_EOF
          mkdir -p symbian/app/inc
          cat > symbian/app/inc/zelda3.h <<'Z3_EOF'
          // zelda3.h - Symbian^3 front end for the zelda3 C port.
          #ifndef ZELDA3_SYMBIAN_H
          #define ZELDA3_SYMBIAN_H

          #include <aknapp.h>
          #include <akndoc.h>
          #include <aknappui.h>
          #include <coecntrl.h>
          #include <e32base.h>
          #include <f32file.h>
          #include <fbs.h>
          #include <mdaaudiosampleplayer.h>
          #include <mdaaudiooutputstream.h>

          #include "z3_platform.h"

          const TUid KUidZelda3 = { (TInt32)0xE1A5B3DA };

          // ---------------------------------------------------------------------------
          // Audio: pushes the PCM16 blocks rendered by the core to a CMdaAudioOutputStream.
          // ---------------------------------------------------------------------------
          class CZelda3Audio : public CBase, public MMdaAudioOutputStreamCallback
              {
          public:
              static CZelda3Audio* NewL(TInt aRate, TInt aChannels);
              ~CZelda3Audio();
              void Write(const TInt16* aSamples, TInt aBytes);   // drops data when the queue is full
              void Suspend();
              void Resume();

              // MMdaAudioOutputStreamCallback
              void MaoscOpenComplete(TInt aError);
              void MaoscBufferCopied(TInt aError, const TDesC8& aBuffer);
              void MaoscPlayComplete(TInt aError);

          private:
              CZelda3Audio(TInt aRate, TInt aChannels);
              void OpenStream();

              enum { KSlots = 5, KSlotBytes = 8192, KChunkFrames = 2 };
              CMdaAudioOutputStream* iStream;
              TInt iRate;
              TInt iChannels;
              TBool iReady;
              TBool iSuspended;
              TBuf8<KSlotBytes> iAcc;
              TBuf8<KSlotBytes> iSlot[KSlots];
              TBool iBusy[KSlots];
              };

          // ---------------------------------------------------------------------------
          // Main control: loading screen, game view, touch pad and overlay menu.
          // ---------------------------------------------------------------------------
          class CZelda3Container : public CCoeControl
              {
          public:
              static CZelda3Container* NewL(const TRect& aRect);
              ~CZelda3Container();
              void SetForeground(TBool aForeground);

              // CCoeControl
              void Draw(const TRect& aRect) const;
              void SizeChanged();
              void HandlePointerEventL(const TPointerEvent& aEvent);
              TKeyResponse OfferKeyEventL(const TKeyEvent& aKeyEvent, TEventCode aType);

          private:
              enum TMode { ELoading, EPlay, EMenu, EError };
              enum { KMenuItems = 7, KMaxPtrs = 5 };

              CZelda3Container();
              void ConstructL(const TRect& aRect);

              static TInt TickCb(TAny* aPtr);
              static TInt InitCb(TAny* aPtr);
              void Tick();
              void DoInit();
              void StartTimer();
              void StopTimer();
              TBool FindDataDir(TDes8& aPath);
              void SetError(const TDesC8& aText);
              void OpenMenu();
              void MenuActionL(TInt aIndex);
              void ComputeLayout();
              void UpdateTouchPad();
              TInt PadFromPoint(const TPoint& aPt) const;
              TRect GameRect() const;
              void DrawButton(CWindowGc& aGc, const TRect& aRect, const TDesC& aLabel, TBool aDown) const;
              void DrawPad(CWindowGc& aGc) const;
              void DrawMenu(CWindowGc& aGc) const;
              void DrawCentred(CWindowGc& aGc, const TDesC& aText, TInt aY) const;

              CFbsBitmap* iBitmap;
              CPeriodic* iTimer;
              CIdle* iIdle;
              CZelda3Audio* iAudio;
              RFs iFs;

              TMode iMode;
              TBool iForeground;
              TBool iSound;
              TInt iScale;              // 0 fit, 1 native, 2 stretch
              TUint iLastTick;
              TInt iAcc;
              TInt iGameW, iGameH;
              TInt iAudioBytes;

              TBuf<160> iErrLine1;
              TBuf<160> iErrLine2;

              TInt iKeyPad;
              TInt iTouchPad;
              TBool iPtrDown[KMaxPtrs];
              TPoint iPtrPos[KMaxPtrs];

              // layout
              TPoint iDpadCentre;
              TInt iDpadR;
              TRect iBtnA, iBtnB, iBtnX, iBtnY, iBtnL, iBtnR, iBtnSelect, iBtnStart, iBtnMenu;
              TInt iMenuSel;
              };

          // ---------------------------------------------------------------------------
          class CZelda3AppUi : public CAknAppUi
              {
          public:
              void ConstructL();
              ~CZelda3AppUi();
              void HandleCommandL(TInt aCommand);
              void HandleForegroundEventL(TBool aForeground);
              void HandleResourceChangeL(TInt aType);
          private:
              CZelda3Container* iContainer;
              };

          class CZelda3Document : public CAknDocument
              {
          public:
              CZelda3Document(CEikApplication& aApp) : CAknDocument(aApp) {}
          private:
              CEikAppUi* CreateAppUiL();
              };

          class CZelda3Application : public CAknApplication
              {
          private:
              CApaDocument* CreateDocumentL();
              TUid AppDllUid() const;
              };

          #endif
          Z3_EOF
          mkdir -p symbian/app/sis
          cat > symbian/app/sis/zelda3.pkg <<'Z3_EOF'
          ; Zelda3 for Symbian^3 - install package (paths are expanded by package-sis.sh)
          &EN
          #{"Zelda3"},(0xE1A5B3DA),1,0,0

          %{"Zelda3 Symbian port"}
          :"Symbian port"

          ; Symbian^3 / S60 5th / S60 3rd platform IDs
          [0x20022E6D], 0, 0, 0, {"S60ProductID"}
          [0x1028315F], 0, 0, 0, {"S60ProductID"}
          [0x102752AE], 0, 0, 0, {"S60ProductID"}
          [0x102032BE], 0, 0, 0, {"S60ProductID"}
          [0x101F7961], 0, 0, 0, {"S60ProductID"}

          "$(epocroot)epoc32/release/$(platform)/$(target)/zelda3.exe"-"!:\sys\bin\zelda3.exe"
          "$(epocroot)epoc32/data/z/resource/apps/zelda3.rsc"-"!:\resource\apps\zelda3.rsc"
          "$(epocroot)epoc32/data/z/private/10003a3f/import/apps/zelda3_reg.rsc"-"!:\private\10003a3f\import\apps\zelda3_reg.rsc"
          "zelda3_assets.bps"-"!:\zelda3\zelda3_assets.bps"
          "zelda3.ini"-"!:\zelda3\zelda3.ini"
          Z3_EOF
          mkdir -p symbian/app/src
          cat > symbian/app/src/zelda3_app.cpp <<'Z3_EOF'
          // Application / document / entry point.
          #include <eikstart.h>
          #include "zelda3.h"

          CApaDocument* CZelda3Application::CreateDocumentL()
              {
              return new (ELeave) CZelda3Document(*this);
              }

          TUid CZelda3Application::AppDllUid() const
              {
              return KUidZelda3;
              }

          CEikAppUi* CZelda3Document::CreateAppUiL()
              {
              return new (ELeave) CZelda3AppUi;
              }

          LOCAL_C CApaApplication* NewApplication()
              {
              return new CZelda3Application;
              }

          GLDEF_C TInt E32Main()
              {
              return EikStart::RunApplication(NewApplication);
              }
          Z3_EOF
          mkdir -p symbian/app/src
          cat > symbian/app/src/zelda3_appui.cpp <<'Z3_EOF'
          // AppUi: owns the full-screen container.
          #include <avkon.hrh>
          #include <eikon.hrh>
          #include <eikenv.h>
          #include <eikspane.h>
          #include <eikbtgpc.h>
          #include "zelda3.h"

          void CZelda3AppUi::ConstructL()
              {
              BaseConstructL(CAknAppUi::EAknEnableSkin);
              SetOrientationL(CAknAppUiBase::EAppUiOrientationLandscape);

              CEikStatusPane* sp = StatusPane();
              if (sp)
                  {
                  sp->MakeVisible(EFalse);
                  }
              CEikButtonGroupContainer* cba = Cba();
              if (cba)
                  {
                  cba->MakeVisible(EFalse);
                  }

              iContainer = CZelda3Container::NewL(ApplicationRect());
              AddToStackL(iContainer);
              }

          CZelda3AppUi::~CZelda3AppUi()
              {
              if (iContainer)
                  {
                  RemoveFromStack(iContainer);
                  delete iContainer;
                  iContainer = NULL;
                  }
              }

          void CZelda3AppUi::HandleCommandL(TInt aCommand)
              {
              switch (aCommand)
                  {
                  case EEikCmdExit:
                  case EAknSoftkeyExit:
                  case EAknCmdExit:
                      Exit();
                      break;
                  default:
                      break;
                  }
              }

          void CZelda3AppUi::HandleForegroundEventL(TBool aForeground)
              {
              CAknAppUi::HandleForegroundEventL(aForeground);
              if (iContainer)
                  {
                  iContainer->SetForeground(aForeground);
                  }
              }

          void CZelda3AppUi::HandleResourceChangeL(TInt aType)
              {
              CAknAppUi::HandleResourceChangeL(aType);
              if (iContainer && aType == KEikDynamicLayoutVariantSwitch)
                  {
                  iContainer->SetRect(ApplicationRect());
                  }
              }
          Z3_EOF
          mkdir -p symbian/app/src
          cat > symbian/app/src/zelda3_audio.cpp <<'Z3_EOF'
          // Audio output through CMdaAudioOutputStream (rate/channels come from the core, usually 32 kHz stereo).
          #include "zelda3.h"

          // TMdaAudioDataSettings values (the class is not visible through the Symbian^3 headers used here).
          static TInt SettingsRate(TInt aHz)
              {
              switch (aHz)
                  {
                  case 8000:  return 0x00000001;
                  case 11025: return 0x00000002;
                  case 16000: return 0x00000004;
                  case 22050: return 0x00000008;
                  case 44100: return 0x00000020;
                  case 48000: return 0x00000040;
                  default:    return 0x00000010;   // 32000
                  }
              }

          static const TInt KChannelsMono = 0x00000001;
          static const TInt KChannelsStereo = 0x00000002;

          CZelda3Audio* CZelda3Audio::NewL(TInt aRate, TInt aChannels)
              {
              CZelda3Audio* self = new (ELeave) CZelda3Audio(aRate, aChannels);
              CleanupStack::PushL(self);
              self->OpenStream();
              CleanupStack::Pop(self);
              return self;
              }

          CZelda3Audio::CZelda3Audio(TInt aRate, TInt aChannels)
              : iRate(aRate), iChannels(aChannels)
              {
              for (TInt i = 0; i < KSlots; ++i)
                  {
                  iBusy[i] = EFalse;
                  }
              }

          CZelda3Audio::~CZelda3Audio()
              {
              if (iStream)
                  {
                  iStream->Stop();
                  delete iStream;
                  }
              }

          void CZelda3Audio::OpenStream()
              {
              iReady = EFalse;
              delete iStream;
              iStream = NULL;
              TRAPD(err, iStream = CMdaAudioOutputStream::NewL(*this));
              if (err == KErrNone && iStream)
                  {
                  iStream->Open(NULL);
                  }
              }

          void CZelda3Audio::MaoscOpenComplete(TInt aError)
              {
              if (aError != KErrNone)
                  {
                  return;
                  }
              TRAPD(err, iStream->SetAudioPropertiesL(SettingsRate(iRate),
                                                      iChannels == 1 ? KChannelsMono : KChannelsStereo));
              if (err != KErrNone)
                  {
                  return;
                  }
              iStream->SetVolume(iStream->MaxVolume() / 2);
              iStream->SetPriority(EPriorityNormal, EMdaPriorityPreferenceTime);
              iAcc.Zero();
              iReady = ETrue;
              }

          void CZelda3Audio::MaoscBufferCopied(TInt /*aError*/, const TDesC8& aBuffer)
              {
              for (TInt i = 0; i < KSlots; ++i)
                  {
                  if (iSlot[i].Ptr() == aBuffer.Ptr())
                      {
                      iBusy[i] = EFalse;
                      }
                  }
              }

          void CZelda3Audio::MaoscPlayComplete(TInt /*aError*/)
              {
              for (TInt i = 0; i < KSlots; ++i)
                  {
                  iBusy[i] = EFalse;
                  }
              }

          // Blocks of one emulated frame are collected into chunks of KChunkFrames before they are queued:
          // very small buffers underrun on some devices.
          void CZelda3Audio::Write(const TInt16* aSamples, TInt aBytes)
              {
              if (!iReady || iSuspended || aBytes <= 0)
                  {
                  return;
                  }
              if (iAcc.Length() + aBytes > KSlotBytes)
                  {
                  iAcc.Zero();    // should not happen; resynchronise
                  }
              iAcc.Append((const TUint8*)aSamples, aBytes);
              if (iAcc.Length() < aBytes * KChunkFrames)
                  {
                  return;
                  }
              for (TInt i = 0; i < KSlots; ++i)
                  {
                  if (!iBusy[i])
                      {
                      iSlot[i].Copy(iAcc);
                      iAcc.Zero();
                      iBusy[i] = ETrue;
                      TRAPD(err, iStream->WriteL(iSlot[i]));
                      if (err != KErrNone)
                          {
                          iBusy[i] = EFalse;
                          }
                      return;
                      }
                  }
              // all slots in flight: drop this chunk to keep latency bounded
              iAcc.Zero();
              }

          void CZelda3Audio::Suspend()
              {
              iSuspended = ETrue;
              if (iStream && iReady)
                  {
                  iStream->Stop();
                  iReady = EFalse;
                  }
              }

          void CZelda3Audio::Resume()
              {
              if (iSuspended)
                  {
                  iSuspended = EFalse;
                  OpenStream();
                  }
              }
          Z3_EOF
          mkdir -p symbian/app/src
          cat > symbian/app/src/zelda3_container.cpp <<'Z3_EOF'
          // Main control: loading screen, game view, multi-touch pad, overlay menu.
          #include <aknutils.h>
          #include <avkon.hrh>
          #include <eikon.hrh>
          #include <eikenv.h>
          #include <w32std.h>
          #include <bautils.h>
          #include "zelda3.h"

          _LIT(KLoading1, "Loading Zelda3...");
          _LIT(KLoading2, "(first start applies the asset patch to your ROM)");
          _LIT(KErrTitle, "Zelda3 could not start");
          _LIT(KErrHint, "Needed in <drive>:\\zelda3\\ : zelda3.sfc (US ROM), zelda3_assets.bps");

          static const TInt KFrameMicros = 15000;

          static const TInt KMenuCount = 7;

          CZelda3Container* CZelda3Container::NewL(const TRect& aRect)
              {
              CZelda3Container* self = new (ELeave) CZelda3Container;
              CleanupStack::PushL(self);
              self->ConstructL(aRect);
              CleanupStack::Pop(self);
              return self;
              }

          CZelda3Container::CZelda3Container()
              {
              }

          CZelda3Container::~CZelda3Container()
              {
              StopTimer();
              delete iTimer;
              delete iIdle;
              delete iAudio;
              delete iBitmap;
              Z3_Shutdown();
              iFs.Close();
              }

          void CZelda3Container::ConstructL(const TRect& aRect)
              {
              CreateWindowL();
              SetExtentToWholeScreen();
              EnableDragEvents();
          #ifdef Z3_MULTITOUCH
              Window().EnableAdvancedPointers();
          #endif
              SetFocusing(ETrue);

              User::LeaveIfError(iFs.Connect());

              iMode = ELoading;
              iSound = ETrue;
              iForeground = ETrue;
              iScale = 0;
              iMenuSel = 0;
              for (TInt i = 0; i < KMaxPtrs; ++i)
                  {
                  iPtrDown[i] = EFalse;
                  }

              SetRect(aRect);
              ActivateL();

              iTimer = CPeriodic::NewL(CActive::EPriorityStandard);
              // start the game from the idle loop so that the loading screen is visible first
              iIdle = CIdle::NewL(CActive::EPriorityIdle);
              iIdle->Start(TCallBack(InitCb, this));
              }

          TInt CZelda3Container::InitCb(TAny* aPtr)
              {
              static_cast<CZelda3Container*>(aPtr)->DoInit();
              return 0;
              }

          void CZelda3Container::SetError(const TDesC8& aText)
              {
              iErrLine1.Zero();
              iErrLine2.Zero();
              TInt len = aText.Length();
              TInt split = 58;
              if (len <= split)
                  {
                  iErrLine1.Copy(aText);
                  }
              else
                  {
                  TInt cut = split;
                  while (cut > 20 && aText[cut] != 32)
                      {
                      --cut;
                      }
                  iErrLine1.Copy(aText.Left(cut));
                  iErrLine2.Copy(aText.Mid(cut).Left(iErrLine2.MaxLength()));
                  }
              iMode = EError;
              }

          // First drive that has \zelda3\ with either a prepared assets file or the .bps patch.
          TBool CZelda3Container::FindDataDir(TDes8& aPath)
              {
              TDriveList list;
              if (iFs.DriveList(list) != KErrNone)
                  {
                  return EFalse;
                  }
              // E: (mass memory on N8) and F: (card) first, then C: and the rest
              const TInt order[8] = { 4, 5, 2, 6, 7, 3, 8, 9 };
              for (TInt k = 0; k < 8; ++k)
                  {
                  TInt d = order[k];
                  if (d >= KMaxDrives || !list[d])
                      {
                      continue;
                      }
                  TChar letter('A' + d);
                  TFileName bps;
                  bps.Append(letter);
                  bps.Append(_L(":\\zelda3\\zelda3_assets.bps"));
                  TFileName dat;
                  dat.Append(letter);
                  dat.Append(_L(":\\zelda3\\zelda3_assets.dat"));
                  if (BaflUtils::FileExists(iFs, bps) || BaflUtils::FileExists(iFs, dat))
                      {
                      aPath.Zero();
                      aPath.Append(letter);
                      aPath.Append(_L8(":/zelda3"));
                      return ETrue;
                      }
                  }
              return EFalse;
              }

          void CZelda3Container::DoInit()
              {
              TBuf8<64> path;
              if (!FindDataDir(path))
                  {
                  SetError(_L8("Folder zelda3 with zelda3_assets.bps not found on any drive."));
                  DrawNow();
                  return;
                  }
              path.ZeroTerminate();
              if (Z3_Init((const char*)path.Ptr()) != 0)
                  {
                  TPtrC8 msg((const TUint8*)Z3_LastError());
                  SetError(msg);
                  DrawNow();
                  return;
                  }

              iGameW = Z3_Width();
              iGameH = Z3_Height();
              iBitmap = new CFbsBitmap;
              if (!iBitmap || iBitmap->Create(TSize(iGameW, iGameH), EColor16MU) != KErrNone)
                  {
                  SetError(_L8("Out of memory (screen buffer)."));
                  DrawNow();
                  return;
                  }
              iAudioBytes = Z3_AudioFrames() * Z3_AudioChannels() * 2;
              if (Z3_AudioEnabled())
                  {
                  TRAPD(aerr, iAudio = CZelda3Audio::NewL(Z3_AudioRate(), Z3_AudioChannels()));
                  if (aerr != KErrNone)
                      {
                      iAudio = NULL;      // run silently when the audio stream is unavailable
                      }
                  }
              else
                  {
                  iSound = EFalse;
                  }

              iMode = EPlay;
              iAcc = 0;
              StartTimer();
              DrawNow();
              }

          void CZelda3Container::StartTimer()
              {
              if (iTimer && !iTimer->IsActive())
                  {
                  iLastTick = User::NTickCount();
                  iTimer->Start(KFrameMicros, KFrameMicros, TCallBack(TickCb, this));
                  }
              }

          void CZelda3Container::StopTimer()
              {
              if (iTimer)
                  {
                  iTimer->Cancel();
                  }
              }

          void CZelda3Container::SetForeground(TBool aForeground)
              {
              iForeground = aForeground;
              if (!aForeground)
                  {
                  StopTimer();
                  if (iAudio)
                      {
                      iAudio->Suspend();
                      }
                  }
              else
                  {
                  if (iAudio && iSound)
                      {
                      iAudio->Resume();
                      }
                  if (iMode == EPlay)
                      {
                      StartTimer();
                      }
                  }
              }

          // ---------------------------------------------------------------------------
          // Emulation tick: runs as many 60 Hz frames as the wall clock demands (max 3), draws the last one.
          // ---------------------------------------------------------------------------
          TInt CZelda3Container::TickCb(TAny* aPtr)
              {
              static_cast<CZelda3Container*>(aPtr)->Tick();
              return 0;
              }

          void CZelda3Container::Tick()
              {
              if (iMode != EPlay || !iForeground)
                  {
                  return;
                  }
              TUint now = User::NTickCount();
              TUint elapsed = now - iLastTick;
              iLastTick = now;
              if (elapsed > 200)
                  {
                  elapsed = 200;
                  }
              iAcc += (TInt)elapsed * 60;
              TInt frames = iAcc / 1000;
              iAcc -= frames * 1000;
              if (frames < 1)
                  {
                  return;
                  }
              if (frames > 3)
                  {
                  frames = 3;
                  iAcc = 0;
                  }

              const TInt pad = iKeyPad | iTouchPad;
              TInt16 abuf[2048];
              for (TInt i = 0; i < frames; ++i)
                  {
                  if (Z3_RunFrame(pad) != 0)
                      {
                      TPtrC8 msg((const TUint8*)Z3_LastError());
                      SetError(msg);
                      StopTimer();
                      DrawNow();
                      return;
                      }
                  if (iAudio && iSound && iAudioBytes <= (TInt)sizeof(abuf))
                      {
                      Z3_RenderAudio(abuf);
                      iAudio->Write(abuf, iAudioBytes);
                      }
                  else if (Z3_AudioEnabled() && iAudioBytes <= (TInt)sizeof(abuf))
                      {
                      Z3_RenderAudio(abuf);       // keep the sound driver running while muted
                      }
                  }

              iBitmap->LockHeap();
              TUint8* dst = (TUint8*)iBitmap->DataAddress();
              TInt stride = iBitmap->DataStride();
              TInt rc = Z3_DrawFrame(dst, stride);
              iBitmap->UnlockHeap();
              if (rc != 0)
                  {
                  TPtrC8 msg((const TUint8*)Z3_LastError());
                  SetError(msg);
                  StopTimer();
                  }
              DrawNow();
              }

          // ---------------------------------------------------------------------------
          // Menu
          // ---------------------------------------------------------------------------
          void CZelda3Container::OpenMenu()
              {
              iTouchPad = 0;
              iKeyPad = 0;
              for (TInt i = 0; i < KMaxPtrs; ++i)
                  {
                  iPtrDown[i] = EFalse;
                  }
              iMode = EMenu;
              iMenuSel = 0;
              StopTimer();
              DrawNow();
              }

          void CZelda3Container::MenuActionL(TInt aIndex)
              {
              switch (aIndex)
                  {
                  case 0:     // resume
                      break;
                  case 1:     // save state
                      Z3_Command(Z3_CMD_SAVE, 0);
                      break;
                  case 2:     // load state
                      Z3_Command(Z3_CMD_LOAD, 0);
                      break;
                  case 3:     // reset
                      Z3_Command(Z3_CMD_RESET, 0);
                      break;
                  case 4:     // scaling
                      iScale = (iScale + 1) % 3;
                      DrawNow();
                      return;
                  case 5:     // sound
                      iSound = !iSound;
                      if (iAudio)
                          {
                          if (iSound) iAudio->Resume(); else iAudio->Suspend();
                          }
                      DrawNow();
                      return;
                  default:    // exit
                      iEikonEnv->EikAppUi()->HandleCommandL(EEikCmdExit);
                      return;
                  }
              iMode = EPlay;
              StartTimer();
              DrawNow();
              }

          // ---------------------------------------------------------------------------
          // Layout and drawing
          // ---------------------------------------------------------------------------
          void CZelda3Container::SizeChanged()
              {
              ComputeLayout();
              }

          void CZelda3Container::ComputeLayout()
              {
              TRect r = Rect();
              TInt w = r.Width(), h = r.Height();
              TInt R = Min(h / 4, w / 6);
              if (R < 30) R = 30;
              iDpadR = R;
              iDpadCentre = TPoint(R + 8, h - R - 24);

              // diamond of face buttons: A right, B bottom, X top, Y left (SNES layout)
              TInt br = R * 3 / 10;
              TPoint c(w - R - 8, h - R - 24);
              TInt off = br * 12 / 10;
              iBtnA = TRect(c.iX + off - br, c.iY - br, c.iX + off + br, c.iY + br);
              iBtnY = TRect(c.iX - off - br, c.iY - br, c.iX - off + br, c.iY + br);
              iBtnX = TRect(c.iX - br, c.iY - off - br, c.iX + br, c.iY - off + br);
              iBtnB = TRect(c.iX - br, c.iY + off - br, c.iX + br, c.iY + off + br);

              TInt sw = 84, sh = 36;
              iBtnL = TRect(6, 6, 6 + 90, 6 + 44);
              iBtnR = TRect(w - 96, 6, w - 6, 50);
              iBtnSelect = TRect(w / 2 - sw - 8, h - sh - 6, w / 2 - 8, h - 6);
              iBtnStart = TRect(w / 2 + 8, h - sh - 6, w / 2 + sw + 8, h - 6);
              iBtnMenu = TRect(w / 2 - 40, 4, w / 2 + 40, 40);
              }

          TRect CZelda3Container::GameRect() const
              {
              TRect r = Rect();
              TInt w = r.Width(), h = r.Height();
              TInt dw, dh;
              if (iScale == 2)
                  {
                  return TRect(0, 0, w, h);
                  }
              if (iScale == 0)
                  {
                  if (h * iGameW <= w * iGameH)
                      {
                      dh = h;
                      dw = h * iGameW / iGameH;
                      }
                  else
                      {
                      dw = w;
                      dh = w * iGameH / iGameW;
                      }
                  }
              else
                  {
                  dw = iGameW;
                  dh = iGameH;
                  }
              TInt x = (w - dw) / 2;
              TInt y = (h - dh) / 2;
              return TRect(x, y, x + dw, y + dh);
              }

          void CZelda3Container::DrawButton(CWindowGc& aGc, const TRect& aRect, const TDesC& aLabel, TBool aDown) const
              {
              aGc.SetPenStyle(CGraphicsContext::ESolidPen);
              aGc.SetPenColor(KRgbGray);
              if (aDown)
                  {
                  aGc.SetBrushStyle(CGraphicsContext::ESolidBrush);
                  aGc.SetBrushColor(TRgb(70, 70, 110));
                  }
              else
                  {
                  aGc.SetBrushStyle(CGraphicsContext::ESolidBrush);
                  aGc.SetBrushColor(KRgbBlack);
                  }
              aGc.DrawRect(aRect);
              aGc.SetBrushStyle(CGraphicsContext::ENullBrush);
              const CFont* font = iEikonEnv->NormalFont();
              aGc.UseFont(font);
              aGc.SetPenColor(KRgbWhite);
              TInt base = (aRect.Height() + font->AscentInPixels() - font->DescentInPixels()) / 2;
              aGc.DrawText(aLabel, aRect, base, CGraphicsContext::ECenter, 0);
              aGc.DiscardFont();
              }

          void CZelda3Container::DrawPad(CWindowGc& aGc) const
              {
              const TInt p = iKeyPad | iTouchPad;
              aGc.SetPenStyle(CGraphicsContext::ESolidPen);
              aGc.SetPenColor(KRgbGray);
              aGc.SetBrushStyle(CGraphicsContext::ESolidBrush);
              aGc.SetBrushColor(KRgbBlack);
              TRect pad(iDpadCentre.iX - iDpadR, iDpadCentre.iY - iDpadR, iDpadCentre.iX + iDpadR, iDpadCentre.iY + iDpadR);
              aGc.DrawEllipse(pad);
              TInt q = iDpadR / 3;
              TRect up(iDpadCentre.iX - q, iDpadCentre.iY - iDpadR, iDpadCentre.iX + q, iDpadCentre.iY - q);
              TRect dn(iDpadCentre.iX - q, iDpadCentre.iY + q, iDpadCentre.iX + q, iDpadCentre.iY + iDpadR);
              TRect lf(iDpadCentre.iX - iDpadR, iDpadCentre.iY - q, iDpadCentre.iX - q, iDpadCentre.iY + q);
              TRect rt(iDpadCentre.iX + q, iDpadCentre.iY - q, iDpadCentre.iX + iDpadR, iDpadCentre.iY + q);
              aGc.SetBrushColor(TRgb(70, 70, 110));
              if (p & Z3_PAD_UP) aGc.DrawRect(up);
              if (p & Z3_PAD_DOWN) aGc.DrawRect(dn);
              if (p & Z3_PAD_LEFT) aGc.DrawRect(lf);
              if (p & Z3_PAD_RIGHT) aGc.DrawRect(rt);
              aGc.SetBrushStyle(CGraphicsContext::ENullBrush);
              aGc.DrawLine(TPoint(iDpadCentre.iX - iDpadR, iDpadCentre.iY), TPoint(iDpadCentre.iX + iDpadR, iDpadCentre.iY));
              aGc.DrawLine(TPoint(iDpadCentre.iX, iDpadCentre.iY - iDpadR), TPoint(iDpadCentre.iX, iDpadCentre.iY + iDpadR));
              DrawButton(aGc, iBtnA, _L("A"), p & Z3_PAD_A);
              DrawButton(aGc, iBtnB, _L("B"), p & Z3_PAD_B);
              DrawButton(aGc, iBtnX, _L("X"), p & Z3_PAD_X);
              DrawButton(aGc, iBtnY, _L("Y"), p & Z3_PAD_Y);
              DrawButton(aGc, iBtnL, _L("L"), p & Z3_PAD_L);
              DrawButton(aGc, iBtnR, _L("R"), p & Z3_PAD_R);
              DrawButton(aGc, iBtnSelect, _L("Select"), p & Z3_PAD_SELECT);
              DrawButton(aGc, iBtnStart, _L("Start"), p & Z3_PAD_START);
              DrawButton(aGc, iBtnMenu, _L("Menu"), EFalse);
              }

          void CZelda3Container::DrawCentred(CWindowGc& aGc, const TDesC& aText, TInt aY) const
              {
              const CFont* font = iEikonEnv->NormalFont();
              aGc.UseFont(font);
              TRect line(0, aY, Rect().Width(), aY + font->HeightInPixels() + 8);
              aGc.DrawText(aText, line, aY + font->AscentInPixels() + 4 - aY, CGraphicsContext::ECenter, 0);
              aGc.DiscardFont();
              }

          void CZelda3Container::DrawMenu(CWindowGc& aGc) const
              {
              TRect r = Rect();
              TInt w = 340, rh = 40, h = KMenuCount * rh;
              TRect box((r.Width() - w) / 2, (r.Height() - h) / 2, (r.Width() + w) / 2, (r.Height() + h) / 2);
              aGc.SetPenStyle(CGraphicsContext::ESolidPen);
              aGc.SetPenColor(KRgbGray);
              aGc.SetBrushStyle(CGraphicsContext::ESolidBrush);
              aGc.SetBrushColor(TRgb(20, 20, 40));
              aGc.DrawRect(box);
              const CFont* font = iEikonEnv->NormalFont();
              aGc.UseFont(font);
              for (TInt i = 0; i < KMenuCount; ++i)
                  {
                  TRect row(box.iTl.iX + 2, box.iTl.iY + i * rh + 2, box.iBr.iX - 2, box.iTl.iY + (i + 1) * rh - 2);
                  if (i == iMenuSel)
                      {
                      aGc.SetBrushColor(TRgb(70, 70, 140));
                      aGc.SetPenStyle(CGraphicsContext::ENullPen);
                      aGc.DrawRect(row);
                      aGc.SetPenStyle(CGraphicsContext::ESolidPen);
                      }
                  aGc.SetPenColor(KRgbWhite);
                  TBuf<40> label;
                  switch (i)
                      {
                      case 0: label = _L("Resume"); break;
                      case 1: label = _L("Save state"); break;
                      case 2: label = _L("Load state"); break;
                      case 3: label = _L("Reset"); break;
                      case 4: label = iScale == 0 ? _L("Scale: fit") : (iScale == 1 ? _L("Scale: native") : _L("Scale: stretch")); break;
                      case 5: label = iSound ? _L("Sound: on") : _L("Sound: off"); break;
                      default: label = _L("Exit"); break;
                      }
                  TInt base = (row.Height() + font->AscentInPixels() - font->DescentInPixels()) / 2;
                  aGc.DrawText(label, row, base, CGraphicsContext::ECenter, 0);
                  aGc.SetBrushColor(TRgb(20, 20, 40));
                  }
              aGc.DiscardFont();
              }

          void CZelda3Container::Draw(const TRect& /*aRect*/) const
              {
              CWindowGc& gc = SystemGc();
              gc.SetPenStyle(CGraphicsContext::ESolidPen);
              gc.SetBrushStyle(CGraphicsContext::ESolidBrush);
              gc.SetBrushColor(KRgbBlack);

              if (iMode == ELoading || iMode == EError)
                  {
                  gc.Clear(Rect());
                  gc.SetPenColor(KRgbWhite);
                  TInt y = Rect().Height() / 2 - 50;
                  if (iMode == ELoading)
                      {
                      DrawCentred(gc, KLoading1, y);
                      DrawCentred(gc, KLoading2, y + 34);
                      }
                  else
                      {
                      DrawCentred(gc, KErrTitle, y);
                      DrawCentred(gc, iErrLine1, y + 34);
                      DrawCentred(gc, iErrLine2, y + 60);
                      DrawCentred(gc, KErrHint, y + 100);
                      }
                  return;
                  }

              TRect g = GameRect();
              // only the margins are cleared; the game rectangle is repainted by the bitmap itself
              TRect r = Rect();
              if (g.iTl.iY > r.iTl.iY) gc.Clear(TRect(r.iTl.iX, r.iTl.iY, r.iBr.iX, g.iTl.iY));
              if (g.iBr.iY < r.iBr.iY) gc.Clear(TRect(r.iTl.iX, g.iBr.iY, r.iBr.iX, r.iBr.iY));
              if (g.iTl.iX > r.iTl.iX) gc.Clear(TRect(r.iTl.iX, g.iTl.iY, g.iTl.iX, g.iBr.iY));
              if (g.iBr.iX < r.iBr.iX) gc.Clear(TRect(g.iBr.iX, g.iTl.iY, r.iBr.iX, g.iBr.iY));
              if (iBitmap)
                  {
                  if (g.Width() == iGameW && g.Height() == iGameH)
                      {
                      gc.BitBlt(g.iTl, iBitmap);
                      }
                  else
                      {
                      gc.DrawBitmap(g, iBitmap);
                      }
                  }
              DrawPad(gc);
              if (iMode == EMenu)
                  {
                  DrawMenu(gc);
                  }
              }

          // ---------------------------------------------------------------------------
          // Input
          // ---------------------------------------------------------------------------
          TInt CZelda3Container::PadFromPoint(const TPoint& aPt) const
              {
              TInt bits = 0;
              if (iBtnA.Contains(aPt)) bits |= Z3_PAD_A;
              if (iBtnB.Contains(aPt)) bits |= Z3_PAD_B;
              if (iBtnX.Contains(aPt)) bits |= Z3_PAD_X;
              if (iBtnY.Contains(aPt)) bits |= Z3_PAD_Y;
              if (iBtnL.Contains(aPt)) bits |= Z3_PAD_L;
              if (iBtnR.Contains(aPt)) bits |= Z3_PAD_R;
              if (iBtnSelect.Contains(aPt)) bits |= Z3_PAD_SELECT;
              if (iBtnStart.Contains(aPt)) bits |= Z3_PAD_START;
              TInt dx = aPt.iX - iDpadCentre.iX;
              TInt dy = aPt.iY - iDpadCentre.iY;
              TInt lim = iDpadR + iDpadR / 3;
              if (dx > -lim && dx < lim && dy > -lim && dy < lim)
                  {
                  TInt dead = iDpadR / 4;
                  if (dx < -dead) bits |= Z3_PAD_LEFT;
                  if (dx > dead) bits |= Z3_PAD_RIGHT;
                  if (dy < -dead) bits |= Z3_PAD_UP;
                  if (dy > dead) bits |= Z3_PAD_DOWN;
                  }
              return bits;
              }

          void CZelda3Container::UpdateTouchPad()
              {
              TInt bits = 0;
              for (TInt i = 0; i < KMaxPtrs; ++i)
                  {
                  if (iPtrDown[i])
                      {
                      bits |= PadFromPoint(iPtrPos[i]);
                      }
                  }
              iTouchPad = bits;
              }

          void CZelda3Container::HandlePointerEventL(const TPointerEvent& aEvent)
              {
              const TPoint pt = aEvent.iPosition;
              TInt id = 0;
          #ifdef Z3_MULTITOUCH
              const TAdvancedPointerEvent* adv = aEvent.AdvancedPointerEvent();
              if (adv)
                  {
                  id = adv->PointerNumber();
                  }
          #endif
              if (id < 0 || id >= KMaxPtrs)
                  {
                  return;
                  }

              if (iMode == EPlay)
                  {
                  if (aEvent.iType == TPointerEvent::EButton1Down && iBtnMenu.Contains(pt))
                      {
                      OpenMenu();
                      return;
                      }
                  if (aEvent.iType == TPointerEvent::EButton1Down || aEvent.iType == TPointerEvent::EDrag)
                      {
                      iPtrDown[id] = ETrue;
                      iPtrPos[id] = pt;
                      }
                  else if (aEvent.iType == TPointerEvent::EButton1Up)
                      {
                      iPtrDown[id] = EFalse;
                      }
                  UpdateTouchPad();
                  return;
                  }

              if (iMode == EMenu)
                  {
                  if (aEvent.iType == TPointerEvent::EButton1Up)
                      {
                      TRect r = Rect();
                      TInt w = 340, rh = 40, h = KMenuCount * rh;
                      TRect box((r.Width() - w) / 2, (r.Height() - h) / 2, (r.Width() + w) / 2, (r.Height() + h) / 2);
                      if (box.Contains(pt))
                          {
                          MenuActionL((pt.iY - box.iTl.iY) / rh);
                          }
                      else
                          {
                          MenuActionL(0);
                          }
                      }
                  return;
                  }

              if (iMode == EError && aEvent.iType == TPointerEvent::EButton1Up)
                  {
                  iEikonEnv->EikAppUi()->HandleCommandL(EEikCmdExit);
                  }
              }

          TKeyResponse CZelda3Container::OfferKeyEventL(const TKeyEvent& aKey, TEventCode aType)
              {
              const TInt sc = aKey.iScanCode;

              if (iMode == EPlay)
                  {
                  TInt bit = 0;
                  switch (sc)
                      {
                      case EStdKeyUpArrow:    bit = Z3_PAD_UP; break;
                      case EStdKeyDownArrow:  bit = Z3_PAD_DOWN; break;
                      case EStdKeyLeftArrow:  bit = Z3_PAD_LEFT; break;
                      case EStdKeyRightArrow: bit = Z3_PAD_RIGHT; break;
                      case 'X':               bit = Z3_PAD_A; break;
                      case 'Z':               bit = Z3_PAD_B; break;
                      case 'S':               bit = Z3_PAD_X; break;
                      case 'A':               bit = Z3_PAD_Y; break;
                      case 'C':               bit = Z3_PAD_L; break;
                      case 'V':               bit = Z3_PAD_R; break;
                      case EStdKeyEnter: case EStdKeyDevice3: bit = Z3_PAD_START; break;
                      case EStdKeySpace: case EStdKeyBackspace: bit = Z3_PAD_SELECT; break;
                      default: break;
                      }
                  if (aType == EEventKeyDown && sc == EStdKeyDevice0)      // left soft key
                      {
                      OpenMenu();
                      return EKeyWasConsumed;
                      }
                  if (bit)
                      {
                      if (aType == EEventKeyDown) iKeyPad |= bit;
                      else if (aType == EEventKeyUp) iKeyPad &= ~bit;
                      return EKeyWasConsumed;
                      }
                  return EKeyWasNotConsumed;
                  }

              if (aType != EEventKeyDown)
                  {
                  return (sc == EStdKeyUpArrow || sc == EStdKeyDownArrow || sc == EStdKeyEnter ||
                          sc == EStdKeyDevice3 || sc == EStdKeyDevice0) ? EKeyWasConsumed : EKeyWasNotConsumed;
                  }

              if (iMode == EMenu)
                  {
                  if (sc == EStdKeyUpArrow && iMenuSel > 0) --iMenuSel;
                  else if (sc == EStdKeyDownArrow && iMenuSel < KMenuCount - 1) ++iMenuSel;
                  else if (sc == EStdKeyEnter || sc == EStdKeyDevice3) { MenuActionL(iMenuSel); return EKeyWasConsumed; }
                  else if (sc == EStdKeyDevice0) { MenuActionL(0); return EKeyWasConsumed; }
                  else return EKeyWasNotConsumed;
                  DrawNow();
                  return EKeyWasConsumed;
                  }

              if (iMode == EError && (sc == EStdKeyEnter || sc == EStdKeyDevice3 || sc == EStdKeyDevice0))
                  {
                  iEikonEnv->EikAppUi()->HandleCommandL(EEikCmdExit);
                  return EKeyWasConsumed;
                  }
              return EKeyWasNotConsumed;
              }
