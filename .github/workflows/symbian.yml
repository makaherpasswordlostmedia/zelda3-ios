          // Only single characters are understood; the Symbian front end does not use the .ini key map.
          static inline SDL_Keycode SDL_GetKeyFromName(const char *name) {
            if (name && name[0] && !name[1]) {
              char c = name[0];
              if (c >= 65 && c <= 90) c = (char)(c + 32);
              return (SDL_Keycode)c;
            }
            return SDLK_UNKNOWN;
